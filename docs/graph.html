<script id="graph-data" type="application/json">{"title":"年报财务舞弊风险知识图谱","description":"以企业年报实际披露的信息连接财务手法、异常信号、财务影响、指标与核查方法。异常不等于舞弊证据，正常交易、估计变更及政策调整须结合适用条件判断。","themes":[{"id":"t01","name":"收入确认与并购利润"},{"id":"t02","name":"费用估计与跨期调节"},{"id":"t03","name":"并购现金流与三表核对"},{"id":"t04","name":"收入条件与政策变更"},{"id":"t05","name":"资本化与现金流分类"},{"id":"t06","name":"关联交易与循环收入"},{"id":"t07","name":"应收质量与贷款减值"},{"id":"t08","name":"一次性损益与费用分类"},{"id":"t09","name":"存货及长期资产减值"},{"id":"t10","name":"合并范围与利润归属"},{"id":"t11","name":"非GAAP利润与现金指标"},{"id":"t12","name":"治理激励与审计风险"},{"id":"t13","name":"营运资本与现金流持续性"},{"id":"t14","name":"保理融资与承诺义务"},{"id":"t15","name":"并购增长口径"},{"id":"t16","name":"订阅与持续经营口径"},{"id":"t17","name":"同店销售口径"},{"id":"t18","name":"衍生品与套期平滑"}],"nodes":[{"id":"n001","label":"以并购对价换回许可费或服务收入","type":"舞弊手法","description":"买方提高对价，同时约定卖方将部分资金作为许可费/服务费支付回来，把对价回收包装为经常收入。","theme":"t01","applicability":"条件披露"},{"id":"n002","label":"高管薪酬以排除并购成本的指标考核","type":"风险信号","description":"以每股现金利润等排除重组、整合、减值及摊销的指标考核，可能激励不计成本并购；股权激励本身不是舞弊证据。","theme":"t01","applicability":"条件披露"},{"id":"n003","label":"用提高并购对价换取设备销售收入","type":"舞弊手法","description":"先向拟购目标销售设备，再增加同额收购对价买回，经济实质可能没有新增销售，却确认收入。","theme":"t01","applicability":"条件披露"},{"id":"n004","label":"将目标公司收入延迟至购买日之后","type":"舞弊手法","description":"压低并购前残期收入，可能把收入移入收购后的合并业绩；仅凭收入波动不能确认收入挪移或判定舞弊。","theme":"t01","applicability":"条件披露"},{"id":"n005","label":"同额增加投资付款和经营收费","type":"风险信号","description":"只有年报披露两向条款和金额时可识别相抵安排；不得推定存在未披露返款。","theme":"t01","applicability":"条件披露"},{"id":"n006","label":"提高合同买价并收取经销商合作费","type":"舞弊手法","description":"合同购买价增加与经销商合作费相互抵销，总净付款不变却把合作费确认为经营流入、购价列投资流出。","theme":"t01","applicability":"条件披露"},{"id":"n007","label":"将并购处置及双向交易作为整体核查","type":"核查方法","description":"合并考察披露的收购/处置对价、设备或许可费、持续供应服务与双方现金流，判断所谓收入是否实为对价调整。条款未披露时年报不能确认。","theme":"t01","applicability":"条件披露"},{"id":"n008","label":"向仍任职卖方支付对价却无经营现金流出","type":"风险信号","description":"在职原股东所得或有付款可能构成报酬的重要部分，需核查究竟是购买对价还是劳动报酬。","theme":"t01","applicability":"条件披露"},{"id":"n009","label":"将对在职原股东付款全部视为并购融资支出","type":"舞弊手法","description":"对继续工作的原合伙人/员工支付或有对价，可能有薪酬实质，却全列筹资等非经营现金流；判断须结合条款。","theme":"t01","applicability":"条件披露"},{"id":"n010","label":"将支付给客户的款项列费用而不抵收入","type":"舞弊手法","description":"将应减少销售收入的客户付款确认为销售费用，提高毛收入；是否应抵收入须根据年报披露的交易实质。","theme":"t01","applicability":"条件披露"},{"id":"n011","label":"以低价处置和高价供应转换一次性利得","type":"舞弊手法","description":"将资产出售压低定价，再约定买方高价采购产品，使一次性处置利得转为后续经常销售收入。","theme":"t01","applicability":"条件披露"},{"id":"n012","label":"并购前向目标方销售设备且对价同额增加","type":"风险信号","description":"年报同时披露设备销售与相应收购价调整时，核查是否应整体视作对价安排；未披露合同无法证实。","theme":"t01","applicability":"条件披露"},{"id":"n013","label":"收购付款与卖方后续支付相互关联","type":"风险信号","description":"年报披露双向付款或长期服务承诺而短期收款时，核查所谓收入是否实质减少并购成本。","theme":"t01","applicability":"条件披露"},{"id":"n014","label":"核对并购前后业绩与购买价分摊","type":"核查方法","description":"年报披露目标公司购买日前后数据时，对照收入、减值、准备、商誉和购买对价，识别收益或费用跨购买日转移的可能；正常业务衰退也可导致异常。","theme":"t01","applicability":"条件披露"},{"id":"n015","label":"并购前收入骤降并购后骤增","type":"风险信号","description":"年报披露购买日前后同口径收入时，异常先跌后升值得核查，也可能是业务衰退或其他真实变化。","theme":"t01","applicability":"条件披露"},{"id":"n016","label":"资产售价偏低同时后续产品售价偏高","type":"风险信号","description":"年报附注披露相关处置及供货价格安排时，可交叉审视一揽子交易；没有价格依据不能假定不公允。","theme":"t01","applicability":"条件披露"},{"id":"n017","label":"并购中介费异常且损失资产转移","type":"风险信号","description":"并购中间人费用与交易金额明显不相称，伴随原投资减少及商誉/关联方转移，需追踪经济实质。","theme":"t01","applicability":"条件披露"},{"id":"n018","label":"对照薪酬目标与被排除的经营成本","type":"核查方法","description":"检查年报薪酬目标是否使用排除并购费用的现金利润等指标，以及这样的激励是否推动不计成本的并购；激励只是风险背景。","theme":"t01","applicability":"条件披露"},{"id":"n019","label":"在并购前残期集中计提未来费用","type":"舞弊手法","description":"目标公司在收购前计提大额资产减值等费用，使本应由合并后承担的费用提前进入残期。","theme":"t01","applicability":"条件披露"},{"id":"n020","label":"收购前削减研发等可裁量成本","type":"风险信号","description":"短期持有者削减研发等支出可能提高短期利润却增加长期经营不确定性；年报可比较费用趋势，不能据此推定动机。","theme":"t01","applicability":"条件披露"},{"id":"n021","label":"并购前资产减值或费用集中增加","type":"风险信号","description":"购买日前费用/减值异常集中、购买日后利润改善，需核实计提依据而非直接否定真实减值。","theme":"t01","applicability":"条件披露"},{"id":"n022","label":"并购会计导致利润可比性下降","type":"财务影响","description":"通过并购取得研发成果形成商誉/无形资产，而自行研发通常承担当期费用；利润差异可由正常会计产生，不能据此断言操纵。","theme":"t01","applicability":"条件披露"},{"id":"n023","label":"利用并购对价和商誉掩盖投资损失","type":"舞弊手法","description":"通过异常并购支出、商誉及关联资产转移遮蔽投资损失。只从年报已披露费用、分摊和关联交易识别信号，不能证实隐秘离岸安排。","theme":"t01","applicability":"条件披露"},{"id":"n024","label":"客户付款被记入销售费用","type":"风险信号","description":"重述或附注显示客户收款和公司销售费用重分类，需核对收入抵减口径。","theme":"t01","applicability":"条件披露"},{"id":"n025","label":"董事会治理及高管薪酬披露","type":"年报披露","description":"监督制衡、财务高管/审计师变更与薪酬业绩考核目标；年报披露时核查。","theme":"t01","applicability":"条件披露"},{"id":"n026","label":"核对代理业务毛额与净额口径","type":"核查方法","description":"区分代收代付款和自身佣金，比较各业务采用的收入口径。","theme":"t01","applicability":"条件披露"},{"id":"n027","label":"以毛额代替净额夸大代理收入","type":"舞弊手法","description":"把代收后应付给商家的金额计入收入，而非仅列自己的佣金。","theme":"t01","applicability":"条件披露"},{"id":"n028","label":"企业合并附注","type":"年报披露","description":"核查并购对增长、准备金及交易对价的影响。\n检查并购前后期间收入、购买安排、重组准备和无形资产取得。\n购买日、对价、购买价分摊、被收购资产负债、收入贡献、或有对价及重大交易安排；明细不足时不能认定未披露的串谋。","theme":"t01","applicability":"条件披露"},{"id":"n029","label":"非现金采购及后续偿债使经营资源付款未入经营现金流","type":"财务影响","description":"以债务直接取得经营资源，取得时无现金流，之后将偿还款列筹资流出，使投入避开经营现金流。","theme":"t02","applicability":"条件披露"},{"id":"n030","label":"重大经营资源以非现金形式取得或投入","type":"风险信号","description":"债务直接购入药权或以存货证券注资养老金，不在当期现金流表显示对应资源消耗。","theme":"t02","applicability":"条件披露"},{"id":"n031","label":"并购前压低目标公司收入以抬高并购后业绩","type":"舞弊手法","description":"在交易完成前残期隐藏收入或延迟履约，把销售贡献留到买方并购后期间。","theme":"t02","applicability":"条件披露"},{"id":"n032","label":"比较并购前残期收入与正常期间收入","type":"核查方法","description":"在年报披露目标公司分期收入时按可比期间或月均比较，区分真实萎缩与并购前后收入挪移风险。","theme":"t02","applicability":"条件披露"},{"id":"n033","label":"未计提应确认的或有损失","type":"舞弊手法","description":"在损失很可能发生且金额可合理估计时未记录相应费用和负债；一般表外采购承诺并不自动等于漏记负债。","theme":"t02","applicability":"条件披露"},{"id":"n034","label":"检查投资损失和资产转移的经济实质","type":"核查方法","description":"对照投资价值下降与减值确认，并审查已披露的亏损投资出售或移转；不能凭年报揭露未披露安排。","theme":"t02","applicability":"条件披露"},{"id":"n035","label":"利用并购准备金抵减后续采购成本","type":"舞弊手法","description":"将并购配套的高价采购义务溢价列为负债，再用于冲减后续存货成本，使利润可被调节。","theme":"t02","applicability":"条件披露"},{"id":"n036","label":"业绩未达标后奖金准备大额转回","type":"风险信号","description":"年度目标未完成导致奖金义务减少、销售管理费用下降，可能被误读为成本效率改善；转回可有真实义务依据。","theme":"t02","applicability":"条件披露"},{"id":"n037","label":"投资价值恶化但未计提相应减值","type":"风险信号","description":"年报呈现投资价值下降却未确认损失，或将亏损投资转出，需关注资产价值及交易实质。","theme":"t02","applicability":"条件披露"},{"id":"n038","label":"不确认投资减值或转移亏损投资","type":"舞弊手法","description":"拒绝确认投资损失，或以出售、移转亏损投资掩盖损失；年报只能核查披露的减值及交易链。","theme":"t02","applicability":"条件披露"},{"id":"n039","label":"并购完成前目标公司收入骤降","type":"风险信号","description":"残期收入显著低于正常期间，可能转移收入至并购后，也可能目标业务真实萎缩。","theme":"t02","applicability":"条件披露"},{"id":"n040","label":"非现金养老金出资使现金流未反映资源投入","type":"财务影响","description":"用存货或证券为养老金出资替代现金付款，表内经营现金流不反映所投入资源；不当然属于违规。","theme":"t02","applicability":"条件披露"},{"id":"n041","label":"从自定义现金流量中剔除正常经营支出","type":"舞弊手法","description":"以近似经营活动现金流量的名称披露自定义指标，排除养老金、员工薪酬等现金开支或忽略营运资本。","theme":"t11","applicability":"条件披露"},{"id":"n042","label":"勾稽预订订单积压订单与收入","type":"核查方法","description":"在年报提供同口径数据时检查期初积压订单加净预订订单减相关收入是否约等于期末积压订单；净预订应扣除取消订单。","theme":"t11","applicability":"条件披露"},{"id":"n043","label":"在自由现金流量中剔除融资性应收款变动","type":"舞弊手法","description":"将对客户长期融资形成的应收款增加排除在自由现金流量之外，使未回收现金表现得仿佛已收回。","theme":"t11","applicability":"条件披露"},{"id":"n044","label":"从调整利润中剔除经常性费用","type":"舞弊手法","description":"将维修、坏账、员工留任、营销、股权激励、重组或连续并购成本等从自定义利润中剔除，掩盖成本结构。","theme":"t11","applicability":"条件披露"},{"id":"n045","label":"扩张预订及积压订单的计算范围","type":"舞弊手法","description":"将超过报告期的订单或非持续许可假定为持续许可，夸大未来需求指标。","theme":"t11","applicability":"条件披露"},{"id":"n046","label":"可分配现金流量仅扣除部分资本开支","type":"风险信号","description":"总资本支出显著高于指标扣除额，且自由现金流量为负仍持续高分红；分类含主观判断，须核查。","theme":"t11","applicability":"条件披露"},{"id":"n047","label":"反复发生的费用被列为一次性调整","type":"风险信号","description":"报表亏损而调整利润盈利，或多年发生的重组等费用持续被排除，是进一步核查信号。","theme":"t11","applicability":"条件披露"},{"id":"n048","label":"现金流量替代指标显著高于报表现金流量","type":"风险信号","description":"替代指标依赖大额其他调整、被排除日常支出或忽略营运资本，与报表经营现金流或自由现金流存在巨大差异。","theme":"t11","applicability":"条件披露"},{"id":"n049","label":"自定义自由现金流量忽略客户借款增长","type":"风险信号","description":"融资性应收款增加拖累经营现金流，但自定义自由现金流量未反映这部分投入。","theme":"t11","applicability":"条件披露"},{"id":"n050","label":"比较年报补充指标与报表及同行口径","type":"核查方法","description":"补充指标可为收入、利润及现金流提供有用信息；在会计分类变化或收购后，统一口径的模拟数据可改善可比性。先理解定义，再与报表和同行核对，不因使用非公认会计准则指标就推定舞弊。","theme":"t11","applicability":"条件披露"},{"id":"n051","label":"以扩产分类排除资本性支出","type":"舞弊手法","description":"计算可分配现金流量时只扣维持性资本支出，管理层将更多支出归为扩产可提高该指标。","theme":"t11","applicability":"条件披露"},{"id":"n052","label":"订单指标含额外期间或假定续约","type":"风险信号","description":"订单期间超出本期、包含可取消/无数量/或有/延期合同或未经确认的续约，应核查定义而非一概否定订单。","theme":"t11","applicability":"条件披露"},{"id":"n053","label":"非公认会计准则指标及调节表","type":"年报披露","description":"年报披露的调整利润、现金流量、指标定义及与财务报表数字的逐项调节；未披露不得推算不存在的明细。","theme":"t11","applicability":"条件披露"},{"id":"n054","label":"高管薪酬与股权激励披露","type":"年报披露","description":"了解薪酬使用的业绩指标、奖励强度和风险导向。","theme":"t12","applicability":"条件披露"},{"id":"n055","label":"关键高管职位集中于已披露亲属","type":"风险信号","description":"仅依据年报明确披露且可核验的亲属和任职关系，评估制衡结构；不推测私人朋友关系，亲属任职本身不等于舞弊。","theme":"t12","applicability":"条件披露"},{"id":"n056","label":"审计任期较长或已披露收费依赖","type":"风险信号","description":"从已披露任期、收费及服务安排评估独立性。不能由长期聘任或单项收费推断私人关系、失职或未披露的经济依赖。","theme":"t12","applicability":"条件披露"},{"id":"n057","label":"审计委员会专业能力或独立性薄弱","type":"风险信号","description":"技能不匹配或未质疑关联交易可能削弱监督。","theme":"t12","applicability":"条件披露"},{"id":"n058","label":"评估治理专业性独立性与激励","type":"核查方法","description":"核查职位关联、董事专业能力、审计聘任及薪酬设计；这些是风险环境而非舞弊证据。","theme":"t12","applicability":"条件披露"},{"id":"n059","label":"公司治理与董事履历披露","type":"年报披露","description":"检查任职关系、专业能力、制衡结构及审计服务安排。","theme":"t12","applicability":"条件披露"},{"id":"n060","label":"将非GAAP指标调回审计口径","type":"核查方法","description":"检查调整项目是否反复发生，是否排除真实现金成本及与激励挂钩。","theme":"t12","applicability":"条件披露"},{"id":"n061","label":"非GAAP指标定义及调节披露","type":"年报披露","description":"比较管理层自定义指标与经审计利润及其剔除项目。","theme":"t12","applicability":"条件披露"},{"id":"n062","label":"非GAAP指标反复剔除经常性成本","type":"风险信号","description":"自定义指标持续排除实际经营成本可能高估可持续盈利。应查看调节表与成本性质，不将非GAAP披露本身定性为舞弊。","theme":"t12","applicability":"条件披露"},{"id":"n063","label":"激励过度依赖股价或非GAAP指标","type":"风险信号","description":"过强激励或可调整口径可能鼓励冒险；业绩薪酬本身可以合理。","theme":"t12","applicability":"条件披露"},{"id":"n064","label":"折扣催收压低应收周转天数且期末现金偏高","type":"风险信号","description":"以折扣加速回款、延后支付使期末现金高于期内，可能是时点管理；年报披露相关政策时可核查。","theme":"t13","applicability":"条件披露"},{"id":"n065","label":"管理层讨论与分析","type":"年报披露","description":"把增长、客户信用、业务模式和现金需求的叙述与报表对应。\n关注资本开支方向、流动性与资本资源以及经营现金流增长的具体来源。\n年报中的业务量、增长来源、分部经营及指标定义披露；补充指标仅在实际披露时可用。","theme":"t13","applicability":"条件披露"},{"id":"n066","label":"无追索权保理仍附信用风险或设备回购义务","type":"风险信号","description":"合同虽称无追索权，客户违约后仍须承担损失或回购设备，提示融资实质与经营流入分类不符。","theme":"t14","applicability":"条件披露"},{"id":"n067","label":"向大客户销售同时作大量采购或资本承诺","type":"风险信号","description":"同一对手既买公司产品又获近额资本开支承诺，可能是回旋镖交易，需核查净经济利益。","theme":"t14","applicability":"条件披露"},{"id":"n068","label":"通过回旋镖交易虚增经营现金流","type":"舞弊手法","description":"向客户销售并向同一客户作近额采购，将收款列经营流入、付款列投资流出，掩盖交易净经济效果。","theme":"t14","applicability":"条件披露"},{"id":"n069","label":"配对核查同一交易对手的购销与现金流","type":"核查方法","description":"对照向客户收款与向同一客户采购或资本承诺，判断经济用途、金额和现金流分类，追踪后续年报披露。","theme":"t14","applicability":"条件披露"},{"id":"n070","label":"将保留信用风险的应收融资列为经营流入","type":"舞弊手法","description":"应收转移仍承担重大违约或回购义务，却将融资收款作为经营现金流；应核查实质而非仅看无追索权名称。","theme":"t14","applicability":"条件披露"},{"id":"n071","label":"扣除已转让未回款应收变动并核查信用风险","type":"核查方法","description":"评估保理对现金流的可持续贡献时，以期末已转让未回款余额的期间增加扣减经营现金流，并核查追索权与实质回购义务。","theme":"t14","applicability":"条件披露"},{"id":"n072","label":"拆分原有业务与被收购业务的收入增长","type":"核查方法","description":"依据企业合并附注和分部披露，区分原有业务、被收购业务和集团整体增长；检查被收购方增长、并购门店或导流客户是否被纳入自然增长。","theme":"t15","applicability":"条件披露"},{"id":"n073","label":"收入自然增长率","type":"财务指标","description":"区分原有业务增长与并购贡献的补充指标；没有统一的公认会计准则定义，需要核实排除范围。","theme":"t15","applicability":"条件披露"},{"id":"n074","label":"自然增长只扣除目标公司历史固定收入","type":"舞弊手法","description":"只剔除目标公司收购前正常收入基数，把目标公司自身新增订单收入留在内部增长中。","theme":"t15","applicability":"条件披露"},{"id":"n075","label":"将新增并购门店纳入同店销售基础","type":"舞弊手法","description":"将新并购的既有门店立即计入同店基础，尤其是表现好的门店，可抬高披露增长。","theme":"t15","applicability":"条件披露"},{"id":"n076","label":"将被购竞争产品客户导流计为自然增长","type":"舞弊手法","description":"收购竞争者后停用其产品，将其客户转至自有产品，再把这部分收入算作自然增长。该经营战略本身可能合理。","theme":"t15","applicability":"条件披露"},{"id":"n077","label":"自然增长指标包含被购业务新增收入","type":"风险信号","description":"自定义自然增长未扣除被购公司全部当期收入，使集团并购收益看似内部增长。","theme":"t15","applicability":"条件披露"},{"id":"n078","label":"被购产品停产而原业务自然增长增强","type":"风险信号","description":"被购业务收入下降和原平台增长同时发生，需检查客户迁移而非直接认定增长自然形成。","theme":"t15","applicability":"条件披露"},{"id":"n079","label":"同店门店组合随收购发生变化","type":"风险信号","description":"连续期间同店基础改变且同店销售与单店平均收入背离，需要剔除并购影响。","theme":"t15","applicability":"条件披露"},{"id":"n080","label":"单位用户平均收入的分子分母口径不一致","type":"风险信号","description":"不同公司可能把广告/激活费纳入或排除，并采用日度或月度加权订户数；直接比较会失真，定义差异本身不证明操纵。","theme":"t16","applicability":"条件披露"},{"id":"n081","label":"将未激活的大宗订阅计入订阅用户数","type":"舞弊手法","description":"将原来激活后才计数的大宗订阅改为销售即纳入，推高订阅用户指标。","theme":"t16","applicability":"条件披露"},{"id":"n082","label":"订阅用户的纳入标准变宽","type":"风险信号","description":"年报披露用户定义时可检查是否计入未激活订阅；年报不披露激活状态时无法查明实际虚增。","theme":"t16","applicability":"条件披露"},{"id":"n083","label":"同店销售额","type":"财务指标","description":"可比门店的收入增长；开业年限、门店类型及扩店/并购处理必须保持口径可比。","theme":"t17","applicability":"条件披露"},{"id":"n084","label":"单位店铺平均收入","type":"财务指标","description":"总收入除以平均总店铺数量，可与同店销售趋势交叉核对；新开门店表现会影响该值。","theme":"t17","applicability":"条件披露"},{"id":"n085","label":"改变同店销售额的可比门店范围","type":"舞弊手法","description":"改变入选门店开业月数、店型或扩张门店处理，使同店销售指标更好看。","theme":"t17","applicability":"条件披露"},{"id":"n086","label":"同店销售增长与单店平均收入背离","type":"风险信号","description":"背离可能源于新增门店表现不佳，也可能来自指标定义改变，需要统一范围核查。","theme":"t17","applicability":"条件披露"},{"id":"n087","label":"不当运用衍生品或套期会计平滑利润","type":"舞弊手法","description":"借错误衍生品核算推迟收益或回避无效套期损失，制造稳定增长。","theme":"t18","applicability":"条件披露"},{"id":"n088","label":"无效套期收益巨大或与基础风险同向变动","type":"风险信号","description":"套期收益远大于基础资产损失或与被套期项目同向，可能实为投机，需检查有效性及损益。","theme":"t18","applicability":"条件披露"},{"id":"n089","label":"将套期工具损益与被套期风险对照","type":"核查方法","description":"检查互换规模是否超过被套期风险、无效部分损益是否确认，以及工具与基础资产变动是否体现风险抵销。","theme":"t18","applicability":"条件披露"},{"id":"n090","label":"衍生金融工具及套期披露","type":"年报披露","description":"检查利率互换、被套期风险、套期有效性及相关损益。","theme":"t18","applicability":"条件披露"},{"id":"n091","label":"用长期票据购买经营性权利后列筹资还款","type":"财务影响","description":"先以长期票据取得经营性药品权利，不影响当期现金流，后续付款列为筹资偿债，使经营现金流未反映相关投入。这是需要联查交易实质和分类的现金流可比性影响；非现金采购或票据偿付本身不等于舞弊。","theme":"t03","applicability":"条件披露"},{"id":"n092","label":"联查并购营运资本和现金流量","type":"核查方法","description":"从购买日资产负债披露估计应收款/存货变现与应付账款偿付影响，并结合并购支付现金衡量现金创造能力；只能在披露范围内估算。","theme":"t03","applicability":"条件披露"},{"id":"n093","label":"出售业务时保留应收账款回收权","type":"财务影响","description":"出售业务但保留应收款回收权，会使业务处置价款减少、后续回款列经营流入。这可以是合规交易结构；分析重点是已处置业务回款对持续经营现金创造能力的影响，不据结构本身认定舞弊。","theme":"t03","applicability":"条件披露"},{"id":"n094","label":"购买日前现金流低迷后立即强劲","type":"风险信号","description":"只有年报提供购买日前后收付款或营运资本资料时才可核查这一模式；余额异常无法证实内部指令。","theme":"t03","applicability":"条件披露"},{"id":"n095","label":"通过受限现金账户支付收购后经营费用","type":"财务影响","description":"当现金流量表仅解释非受限现金变动时，受限账户支付被购公司营运资本和持续研发支出，可能不影响其披露的常规经营现金流或自由现金流。这是该现金范围下的可比性影响；须结合适用列报规则核查，不能直接判定处理不当，也不适用于所有时期。","theme":"t03","applicability":"条件披露"},{"id":"n096","label":"将客户取得成本包装为合同并购","type":"舞弊手法","description":"将外部经销商带来销售合同的常规获客付款当成并购支出，移出经营现金流。","theme":"t03","applicability":"条件披露"},{"id":"n097","label":"受限账户经营支出未反映在常规现金流中","type":"风险信号","description":"年报同时披露受限账户用途与现金流量表现金范围时，检查运营支出是否被遗漏于常用经营现金流指标。","theme":"t03","applicability":"条件披露"},{"id":"n098","label":"业务已出售但相关应收款仍保留","type":"风险信号","description":"年报披露保留已处置业务应收款时，应识别其未来回款不属于持续业务创造。","theme":"t03","applicability":"条件披露"},{"id":"n099","label":"日常获客支出列为投资现金流出","type":"风险信号","description":"年报披露合同取得付款/政策时，比较外包获客费用与内部销售成本的实质和现金流分类。","theme":"t03","applicability":"条件披露"},{"id":"n100","label":"非现金取得权利后付款列偿债","type":"风险信号","description":"年报披露非现金交易和后续偿债时，应结合取得资产/权利的实质核查，不能把所有以票据购资都认定为经营支出。","theme":"t03","applicability":"条件披露"},{"id":"n101","label":"收购业务时排除应付账款","type":"财务影响","description":"收购时排除部分应付款，可使购买对价较高；后续被购营运资产变现形成经营流入，却没有对应被排除应付款的经营流出。这可以是合规交易结构，需分析现金流可比性与可持续性。","theme":"t03","applicability":"条件披露"},{"id":"n102","label":"利用息税折旧摊销前利润忽略核心资本化成本","type":"舞弊手法","description":"用EBITDA等展示业绩时剔除预付客户激励、网络设备和软件等核心成本的摊销/折旧，可遮蔽真实经营成本；资本化本身可能合规。","theme":"t03","applicability":"条件披露"},{"id":"n103","label":"并购前推迟收款并提前付款","type":"舞弊手法","description":"目标公司在收购前暂缓收款并提前支付供应商，购买后恢复收款和正常付款，短期抬高合并经营现金流。","theme":"t03","applicability":"条件披露"},{"id":"n104","label":"收购继承资产却未承担相关供应商债务","type":"风险信号","description":"购买价分摊/协议披露排除供应商债务时，经营现金流改善可能来自交易结构而非经营提升。","theme":"t03","applicability":"条件披露"},{"id":"n105","label":"调整利润不承担持续投入的折旧摊销","type":"风险信号","description":"资本密集业务报表持续亏损而EBITDA为正，或每年支付的预付款摊销被剔除，需检查被排除成本。","theme":"t03","applicability":"条件披露"},{"id":"n106","label":"业务处置及持续供应协议附注","type":"年报披露","description":"业务/资产出售对价、保留应收款、后续供应或服务安排及价格条款；只核查年报已披露条款。","theme":"t03","applicability":"条件披露"},{"id":"n107","label":"受限资金及现金流量表补充资料","type":"年报披露","description":"受限现金的形成和用途、相关营运资本或研发支出、现金流量表现金范围及非现金交易。","theme":"t03","applicability":"条件披露"},{"id":"n108","label":"供应商信用大于利润且缺乏现金支持","type":"风险信号","description":"大额返利或账面卖方信用显著贡献利润，关联供应商参与且经营现金流仍弱，提示采购定价或费用错配。","theme":"t03","applicability":"条件披露"},{"id":"n109","label":"不当以供应商返利或卖方信用冲减费用","type":"舞弊手法","description":"把应归未来采购的返利或异常卖方信用冲减当前成本；未披露的承诺函不能仅凭年报查明。","theme":"t03","applicability":"条件披露"},{"id":"n110","label":"核查供应商信用的现金和采购条件","type":"核查方法","description":"核对返利所属采购期间、是否只作账面信用、金额对利润贡献以及关联关系；只检查年报披露的条款。","theme":"t03","applicability":"条件披露"},{"id":"n111","label":"付款前提不确定时确认收入","type":"舞弊手法","description":"买方仍待外部融资或可因未获资金取消交易时提前确认。","theme":"t04","applicability":"条件披露"},{"id":"n112","label":"重大销售合同与履约条件披露","type":"年报披露","description":"仅在年报披露时核查交货、退货、付款和风险转移条件。","theme":"t04","applicability":"条件披露"},{"id":"n113","label":"买方未取得产品即借中介交货确认收入","type":"舞弊手法","description":"仅指买方尚不能取得产品或履约未完成而提前确认。使用中介或第三方仓库本身正常，未披露事实不能仅由年报查明。","theme":"t04","applicability":"条件披露"},{"id":"n114","label":"未满足履约条件即一次确认多年许可收入","type":"舞弊手法","description":"仅指未来服务或其他收入条件尚未满足却把多年使用费现值一次确认。可合法在履约完成时确认的许可收入不在此列。","theme":"t04","applicability":"条件披露"},{"id":"n115","label":"不满足确认条件的开票持有收入","type":"舞弊手法","description":"仅指未满足交付等收入条件却利用开票持有确认。应区分由买方提出并满足适用条件的正常安排。","theme":"t04","applicability":"条件披露"},{"id":"n116","label":"主要履约义务未完成即确认收入","type":"舞弊手法","description":"仅签约、未交付可用产品或尚未履约便计入收入。","theme":"t04","applicability":"条件披露"},{"id":"n117","label":"报告期间延长导致收入不可比","type":"财务影响","description":"公开披露的报告期延长可能增加所含销售天数。应按一致期间比较，不将正常会计期间调整等同秘密延长关账或舞弊。","theme":"t04","applicability":"条件披露"},{"id":"n118","label":"渠道提前进货引致销售前移","type":"财务影响","description":"向渠道提前发货可暂时提高销售并透支后期需求。应核查接受、退货和付款条件；合法提前采购本身不等于虚假收入。","theme":"t04","applicability":"条件披露"},{"id":"n119","label":"寄售尚未售给终端即确认收入","type":"舞弊手法","description":"在代销人与最终客户成交前确认寄售收入，可能不符合交易实际进度。","theme":"t04","applicability":"条件披露"},{"id":"n120","label":"忽视退货权或低估预计退货","type":"舞弊手法","description":"客户仍有退货或取消权时，未作必要的收入递延或退货估计。","theme":"t04","applicability":"条件披露"},{"id":"n121","label":"宽松信用条款引致销售前移","type":"财务影响","description":"延期付款等条件可能促使客户提前购买并改变收入节奏。信用优惠本身可以合法合理，应分析回款及增长可持续性。","theme":"t04","applicability":"条件披露"},{"id":"n122","label":"未兑付礼品卡估计变更带来的利润前移","type":"财务影响","description":"未兑付余额的政策或估计调整可能使利润提前确认。需核查依据和量化影响，正常估计更新本身不是舞弊。","theme":"t04","applicability":"条件披露"},{"id":"n123","label":"延长付款期限和提早购买计划","type":"风险信号","description":"正常商业优惠也可能提前消耗未来需求，需结合DSO和回款分析。","theme":"t04","applicability":"条件披露"},{"id":"n124","label":"核对履约验收退货及付款条件","type":"核查方法","description":"确认收入是否与已履约部分相称，并检查验收、退货和支付前提。","theme":"t04","applicability":"条件披露"},{"id":"n125","label":"经销收入确认提前且渠道存货增加","type":"风险信号","description":"终端销售未同步时，向渠道发货可能透支需求；渠道存货须以年报已披露信息为限。","theme":"t04","applicability":"条件披露"},{"id":"n126","label":"客户支付依赖尚未落实的外部资金","type":"风险信号","description":"若取得外部资金是交易继续的前提，收入可收回性存在条件。","theme":"t04","applicability":"条件披露"},{"id":"n127","label":"开票持有或第三方仓储收入","type":"风险信号","description":"货物仍由卖方或中介持有时，应检查交易发起方和买方接受条件。","theme":"t04","applicability":"条件披露"},{"id":"n128","label":"可收回性判断变更带来的收入前移","type":"财务影响","description":"重新评估可收回性可能使原待收现金的收入提前确认。需核查证据以及其他收入条件是否满足，合理判断变化不属于舞弊。","theme":"t04","applicability":"条件披露"},{"id":"n129","label":"退货权宽松或实际退货超估计","type":"风险信号","description":"需核查收入抵减及退货估计，保留退货权本身并不证明虚假销售。","theme":"t04","applicability":"条件披露"},{"id":"n130","label":"银行代付供应商且偿付列入筹资活动","type":"风险信号","description":"供应商融资使原采购支出以短期借款偿还出现，经营现金流可比性受影响。","theme":"t05","applicability":"条件披露"},{"id":"n131","label":"将附回购条件的借款伪装成存货销售","type":"舞弊手法","description":"将向银行出售并短期溢价回购库存的借款实质包装为销售收款，虚增收入和经营现金流。","theme":"t05","applicability":"条件披露"},{"id":"n132","label":"预付款项可能对应已经取得的货物","type":"风险信号","description":"将已交货商品补价称为下期预付款会延迟成本；仅当年报披露用途或交易时间时可识别期间错配疑点。","theme":"t05","applicability":"条件披露"},{"id":"n133","label":"将借款现金记录为销售收入","type":"舞弊手法","description":"将必须偿还的融资误记为销货款，可能同时虚增经营现金流。","theme":"t05","applicability":"条件披露"},{"id":"n134","label":"按交易经济实质重审现金流三类归属","type":"核查方法","description":"并读三类现金流与交易条款，核查销售回购、关联融资、资本化和债务偿付；把分类差异与违规区分开。","theme":"t05","applicability":"条件披露"},{"id":"n135","label":"租赁及融资安排附注","type":"年报披露","description":"检查出租设备残值、许可协议租赁分类、非现金取得资产与后续偿债付款。","theme":"t05","applicability":"条件披露"},{"id":"n136","label":"供应商融资使采购还款列入筹资活动","type":"财务影响","description":"由银行先付供应商、公司随后偿还银行，采购付款以借款偿还列筹资，影响经营现金流可比性。","theme":"t05","applicability":"条件披露"},{"id":"n137","label":"向银行售存货并承诺短期溢价购回","type":"风险信号","description":"看似销售却存在短期回购与固定溢价，可能实为抵押融资；未披露协议不能从报表数字独自证实。","theme":"t05","applicability":"条件披露"},{"id":"n138","label":"通过不公允关联销售抬高收入","type":"舞弊手法","description":"交易条件缺乏公允性可能虚增收入；正常关联交易并不等于舞弊。","theme":"t06","applicability":"条件披露"},{"id":"n139","label":"表外关联实体融资后向公司采购","type":"风险信号","description":"公司担保或控制的实体借款并采购本公司商品，经营收款可能掩盖融资来源。","theme":"t06","applicability":"条件披露"},{"id":"n140","label":"供应商返利及退款政策披露","type":"年报披露","description":"关注供应商退款应归属成本调整还是其他收入。","theme":"t06","applicability":"条件披露"},{"id":"n141","label":"客户融资支持的销售增长","type":"财务影响","description":"卖方或股东提供资金可能支持客户购买。客户融资本身可以正常，需核查回款来源、真实需求及合同实质，不由融资存在直接推断造假。","theme":"t06","applicability":"条件披露"},{"id":"n142","label":"合看资产出售和后续购销合同","type":"核查方法","description":"合并分析一揽子交易的定价；双方年报披露时交叉核对，不能将让利动机当作已证事实。","theme":"t06","applicability":"条件披露"},{"id":"n143","label":"客户回款依赖股东或卖方融资","type":"风险信号","description":"回款可能依赖另一路资金支持，需区分正常融资与循环回款。","theme":"t06","applicability":"条件披露"},{"id":"n144","label":"报告日前回购交易或负债余额异常变动","type":"风险信号","description":"如年报披露期末与期间余额，可核查年末窗口修饰；仅有年末单点不能确认。","theme":"t06","applicability":"条件披露"},{"id":"n145","label":"将无风险转移的保险融资确认为收入","type":"舞弊手法","description":"已发生损失且无实质风险转移的安排可能只是融资而非保险收入。","theme":"t06","applicability":"条件披露"},{"id":"n146","label":"回购融资销售列报降低期末负债","type":"财务影响","description":"把具有融资实质的回购安排按销售列报会改变报告负债。应核查风险转移和回购义务，不仅凭交易名称或期末余额判定会计违规。","theme":"t06","applicability":"条件披露"},{"id":"n147","label":"重大资产处置及附带协议披露","type":"年报披露","description":"把出售资产和后续采购、销售或服务协议放在一起分析。","theme":"t06","applicability":"条件披露"},{"id":"n148","label":"借关联实体融资制造经营收款","type":"舞弊手法","description":"担保关联实体借款，再由该实体向自身采购，只列销售现金流而忽略融资经济实质。","theme":"t06","applicability":"条件披露"},{"id":"n149","label":"区分销售收款借款和供应商退款","type":"核查方法","description":"收到现金不自动形成收入，需辨别还本义务、风险转移与采购成本调整。","theme":"t06","applicability":"条件披露"},{"id":"n150","label":"将供应商退款返利错误记录为收入","type":"舞弊手法","description":"本属购货成本调整的退款被记作收入，或确认超过依据的返利。","theme":"t06","applicability":"条件披露"},{"id":"n151","label":"核对关联交易定价与资金回路","type":"核查方法","description":"查看客户供应商股东的重叠、往来余额和双向款项；未披露串谋不能仅凭年报查明。","theme":"t06","applicability":"条件披露"},{"id":"n152","label":"借款及融资安排附注","type":"年报披露","description":"查看抵押、回购、借款期限以及交易的融资实质。","theme":"t06","applicability":"条件披露"},{"id":"n153","label":"核查非货币性收入估值及关联性","type":"核查方法","description":"比较易货收入占比、估值依据和交易对手关系，不把估计金额等同现金需求。","theme":"t06","applicability":"条件披露"},{"id":"n154","label":"关联方及关联交易附注","type":"年报披露","description":"识别关联客户、供应商、股东和合资方之间的交易与余额。\n检查关联供应商保证金、卖方信用及关联实体销售、融资和担保。\n收购或处置中关联方关系、交易金额和资产转移情况；不能据此查明未披露的离岸实体。","theme":"t06","applicability":"条件披露"},{"id":"n155","label":"资产处置与后续购销定价改变利润来源","type":"财务影响","description":"资产出售与后续购销服务的整体定价可能在一次性利得和持续利润之间分配金额。应核查完整条款与公允性，不将组合交易直接认定舞弊。","theme":"t06","applicability":"条件披露"},{"id":"n156","label":"与同一对手同时销售采购或投资","type":"风险信号","description":"资金双向流动可能包含补偿或往返安排，交易本身仍可能正常。","theme":"t06","applicability":"条件披露"},{"id":"n157","label":"利用非货币交换估值虚增收入","type":"舞弊手法","description":"通过易货或数据资产交换估计收入，缺少现金定价约束时可能夸大金额。","theme":"t06","applicability":"条件披露"},{"id":"n158","label":"通过往返购销资金制造收入","type":"舞弊手法","description":"销售后从同一交易方采购或补偿，使款项回流；需核查合并经济实质。","theme":"t06","applicability":"条件披露"},{"id":"n159","label":"供应商退款返利显著贡献收益","type":"风险信号","description":"需区分真实采购成本调整和错误计入收入或过度确认。","theme":"t06","applicability":"条件披露"},{"id":"n160","label":"资产处置同时绑定未来购销服务","type":"风险信号","description":"需核查一次性对价是否与未来经营收支互相补偿。","theme":"t06","applicability":"条件披露"},{"id":"n161","label":"应收周转指标由期末余额改为平均余额","type":"风险信号","description":"披露周转天数改善而期末应收款增长较快，或年度公式口径改变，需用统一期末口径比较。","theme":"t07","applicability":"条件披露"},{"id":"n162","label":"改变周转天数取数口径掩盖期末应收款增长","type":"舞弊手法","description":"期末应收款激增时改用平均余额，可能使披露的周转天数更平缓。平均余额对衡量平均回款周期本有用途。","theme":"t07","applicability":"条件披露"},{"id":"n163","label":"借并购商誉和后续减值消化虚增资产","type":"舞弊手法","description":"可能通过并购把虚增资产转入商誉，再通过后续减值消化资产问题；高商誉或减值本身不能证明该机制。","theme":"t07","applicability":"条件披露"},{"id":"n164","label":"临时压缩广告薪酬投入改善当期利润","type":"财务影响","description":"推迟广告或短期降低工资可能提高当期利润，属于经营决策影响；须分析能否持续，不因费用下降而认定舞弊。","theme":"t08","applicability":"条件披露"},{"id":"n165","label":"以一次性利得净额抵销专项费用","type":"舞弊手法","description":"费用与利得抵销而未清楚展示，可能遮蔽正常费用和累计问题。","theme":"t08","applicability":"条件披露"},{"id":"n166","label":"当期在店存货与上期总存货混比","type":"风险信号","description":"新指标弱化存货增长，但资产负债表总存货或周转天数恶化，需统一范围。","theme":"t09","applicability":"条件披露"},{"id":"n167","label":"以在店存货替换总存货指标","type":"舞弊手法","description":"用只覆盖门店货架的存货新指标忽略不在店存货，并将本期窄口径与上期总口径比较。","theme":"t09","applicability":"条件披露"},{"id":"n168","label":"核查项目递延成本的未来回收基础","type":"核查方法","description":"对照项目亏损、实际成本与预期平均成本、交付进展及递延成本，检查是否仍有合理未来收益支持。","theme":"t09","applicability":"条件披露"},{"id":"n169","label":"设备报废或收益下降却仍按旧计划折旧","type":"风险信号","description":"已失去未来利益的设备仍按原寿命折旧，可能未及时减值；须有年报中资产状态信息支持。","theme":"t09","applicability":"条件披露"},{"id":"n170","label":"在亏损项目中继续递延生产成本","type":"舞弊手法","description":"用预计平均成本结转项目成本，将实际成本超额部分长期留作存货，已难收回时仍缓慢核销。","theme":"t09","applicability":"条件披露"},{"id":"n171","label":"亏损项目仍积累大额递延生产成本","type":"风险信号","description":"项目预期成本未能下降或持续亏损，递延生产成本却长期留存，可能存在未来收回困难。","theme":"t09","applicability":"条件披露"},{"id":"n172","label":"债务或亏损移出报表","type":"财务影响","description":"不恰当的合并范围或融资分类可能隐藏负债和损失。","theme":"t10","applicability":"条件披露"},{"id":"n173","label":"掩饰控制关系规避合并抵销","type":"舞弊手法","description":"以名义股权或结构化安排掩盖控制，可能遗漏应合并主体；实际控制须证据支持。","theme":"t10","applicability":"条件披露"},{"id":"n174","label":"分部收入及毛利披露","type":"年报披露","description":"分开查看不同业务的收入性质与盈利能力。","theme":"t10","applicability":"条件披露"},{"id":"n175","label":"按控制实质核查合并范围","type":"核查方法","description":"核对回购义务、资金来源和实际控制；不能只凭持股比例或公司名称判定控制。","theme":"t10","applicability":"条件披露"},{"id":"n176","label":"名义低持股仍承担回购或融资义务","type":"风险信号","description":"表面少数持股未必排除控制；须核查协议和资本性质。","theme":"t10","applicability":"条件披露"},{"id":"n177","label":"非核心利息或投资收益抬高营业利润","type":"财务影响","description":"非金融企业的利息或投资收入可能掩盖主营亏损。分析其来源与持续性；该收入的存在不等于虚假，金融机构正常利息收入不适用此风险。","theme":"t10","applicability":"条件披露"},{"id":"n178","label":"重大费用转回藏于不相干标题下","type":"风险信号","description":"利润改善来自重大奖金预提转回，但对应说明位于年报业务季节性等段落，不能仅阅读常规费用附注。","theme":"t01","applicability":"直接披露"},{"id":"n179","label":"把下期销售提前记入本期","type":"舞弊手法","description":"在本期确认本应属于以后期间的收入以提高当期业绩。","theme":"t01","applicability":"直接披露"},{"id":"n180","label":"重述显示收入跨期提前确认","type":"风险信号","description":"年报差错更正披露收入跨期、发货确认或销售退回控制缺陷，提供待核查的具体科目链。","theme":"t01","applicability":"直接披露"},{"id":"n181","label":"重述显示销售退回准备不足","type":"风险信号","description":"年报重述或退货准备明细显示准备不足，需核对相关收入、客户和内部控制披露。","theme":"t01","applicability":"直接披露"},{"id":"n182","label":"少计销售退回准备虚增利润","type":"舞弊手法","description":"未足额确认已应计提的销售退回准备，使销售和利润高于应有水平。","theme":"t01","applicability":"直接披露"},{"id":"n183","label":"以奖金预提转回推高当期利润","type":"财务影响","description":"转回先前预提奖金会降低销售及管理费用、提高当期利润。转回可能合理，需核查估计依据和金额；相关说明也可能位于业务季节性等段落，应完整阅读年报，不能仅凭转回判定舞弊。","theme":"t01","applicability":"直接披露"},{"id":"n184","label":"会计差错更正及重述附注","type":"年报披露","description":"以前年度差错性质、受影响科目、重述金额、期间与业务表现。","theme":"t01","applicability":"直接披露"},{"id":"n185","label":"内部控制评价与审计披露","type":"年报披露","description":"收入确认、销售退回、客户审批及财务报表列报的重大控制缺陷与整改信息。","theme":"t01","applicability":"直接披露"},{"id":"n186","label":"贷款损失准备及资产质量附注","type":"年报披露","description":"贷款组合、拖欠/不良情况、核销、损失准备变动，以及是否合并其他准备披露。","theme":"t01","applicability":"直接披露"},{"id":"n187","label":"预计负债及或有对价附注","type":"年报披露","description":"重组、裁员、诉讼等准备的计提与转回，以及并购或有对价估值和后续变动。","theme":"t01","applicability":"直接披露"},{"id":"n188","label":"销售退回及客户付款附注","type":"年报披露","description":"销售退回准备、支付给客户的款项及其收入抵减或费用列报口径。","theme":"t01","applicability":"直接披露"},{"id":"n189","label":"利润表","type":"年报披露","description":"联合观察收入、成本、费用和营业利润，避免只看净利润。\n检查收入、营业成本、期间费用、减值损失、养老金收益及非经常性收益对利润的影响。\n年度及比较期间的收入、营业利润、净利润与相关费用。","theme":"t01","applicability":"直接披露"},{"id":"n190","label":"养老金收益占营业利润比例过大","type":"风险信号","description":"养老金资产收益超过新增费用形成净收益，并可能隐藏在薪酬费用中；成熟计划新增员工较少可能是正常原因之一。","theme":"t02","applicability":"直接披露"},{"id":"n191","label":"养老金及职工福利附注","type":"年报披露","description":"检查养老金精算假设、计量日、收益、自办保险、奖金准备及非现金注资。","theme":"t02","applicability":"直接披露"},{"id":"n192","label":"核对或有损失确认条件和表外承诺","type":"核查方法","description":"检查损失是否很可能发生及能否合理估计；独立阅读未计入负债的大额采购等承诺，区分支付义务与当期费用。","theme":"t02","applicability":"直接披露"},{"id":"n193","label":"预计负债及准备金变动附注","type":"年报披露","description":"检查重组、质保、解雇及其他准备金的期初、新增、使用、转回和期末余额。","theme":"t02","applicability":"直接披露"},{"id":"n194","label":"养老金收益占营业利润比例","type":"财务指标","description":"检查非主营养老金收益对营业利润的贡献程度，防止将其误作业务盈利。","theme":"t02","applicability":"直接披露"},{"id":"n195","label":"查阅非现金投资筹资与养老金出资披露","type":"核查方法","description":"检查非现金取得经营资源及非现金养老金供款，并追踪后续偿债现金支出，以避免遗漏真实资源投入。","theme":"t02","applicability":"直接披露"},{"id":"n196","label":"重大或有损失或不可撤销承诺披露突出","type":"风险信号","description":"潜在赔付、税务争议或不可撤销采购义务可能在表外；是否应计提取决于损失概率及可估计性。","theme":"t02","applicability":"直接披露"},{"id":"n197","label":"审计报告","type":"年报披露","description":"关注审计意见及保留事项；无保留意见不能替代独立财报分析。\n审计师对重大交易无法验证的说明、保留或其他异常审计披露。","theme":"t12","applicability":"直接披露"},{"id":"n198","label":"应收可回收性引发审计保留意见","type":"风险信号","description":"审计师无法取得充分证据属于核查重点，并非已确认全部应收虚假。","theme":"t12","applicability":"直接披露"},{"id":"n199","label":"应收账款转让及保理附注","type":"年报披露","description":"检查保理、证券化、已转让未回款余额、追索权和客户违约后的回购承诺。","theme":"t14","applicability":"直接披露"},{"id":"n200","label":"承诺和或有事项附注","type":"年报披露","description":"检查重大采购承诺、长期租约、诉讼税务争议及预计赔付。","theme":"t14","applicability":"直接披露"},{"id":"n201","label":"现金流量表","type":"年报披露","description":"分析经营、投资和筹资现金流的分类及相互关系。\n同时阅读经营、投资和筹资三部分，关注现金流量分类及营运资本变动。\n经营、投资和筹资活动现金流量及资本性支出、并购付款和股利支付。","theme":"t03","applicability":"直接披露"},{"id":"n202","label":"现金流量表补充资料","type":"年报披露","description":"检查净利润到经营现金流的调整及非现金投资筹资交易。","theme":"t03","applicability":"直接披露"},{"id":"n203","label":"固定资产及折旧附注","type":"年报披露","description":"核对资产增加、残值、使用年限和折旧费用。\n检查使用寿命、残值、折旧、报废及减值与设备实际使用状况的披露。","theme":"t04","applicability":"直接披露"},{"id":"n204","label":"投资或筹资流出项目实质用于日常业务","type":"风险信号","description":"DVD、软件许可、药权或技术采购等支出落在经营以外，需要结合业务用途评价完整现金投入。","theme":"t05","applicability":"直接披露"},{"id":"n205","label":"外购技术投入列入投资活动使经营现金流偏高","type":"财务影响","description":"把替代内部研发的专利、药权及开发阶段技术购买列为投资，未呈现维持业务所需的完整现金投入；不当然违规。","theme":"t05","applicability":"直接披露"},{"id":"n206","label":"预付款项及其他资产附注","type":"年报披露","description":"检查新增保证金、预付款、其他资产及其经济用途。","theme":"t05","applicability":"直接披露"},{"id":"n207","label":"无形资产及摊销附注","type":"年报披露","description":"检查资本化开发支出、递延成本、无形资产的摊销期、核销与新增购买。","theme":"t05","applicability":"直接披露"},{"id":"n208","label":"将非日常资产处置收益伪装成经常性收入","type":"舞弊手法","description":"仅指把非日常的一次性资产卖断收益误导性地包装为可持续经营收入；正常资产处置和适当列报并不属于舞弊。","theme":"t06","applicability":"直接披露"},{"id":"n209","label":"非货币性交易附注","type":"年报披露","description":"检查易货和数据资产交换的定价、占比及关联关系。","theme":"t06","applicability":"直接披露"},{"id":"n210","label":"应收票据与现金等价物分类附注","type":"年报披露","description":"银行票据、商业票据、长期应收款与现金等价物的分类、金额及到期安排。","theme":"t07","applicability":"直接披露"},{"id":"n211","label":"资产减值附注","type":"年报披露","description":"查看商誉等资产减值和账面资产质量。\n检查固定资产、存货与投资的减值计提、转回或核销依据。\n收购前后的资产减值、减值对象、金额与商誉等资产余额的变化。","theme":"t07","applicability":"直接披露"},{"id":"n212","label":"应收账款及坏账准备附注","type":"年报披露","description":"查看账龄、逾期、信用条件、集中度及坏账估计。\n检查应收账款、信用损失、坏账准备及客户融资对销售回款的影响。\n应收账款余额、转让/融资安排、坏账准备及处置业务后保留应收款的披露。","theme":"t07","applicability":"直接披露"},{"id":"n213","label":"贷款及贷款损失准备附注","type":"年报披露","description":"检查贷款余额、不良或逾期贷款、贷款损失准备与覆盖关系。","theme":"t07","applicability":"直接披露"},{"id":"n214","label":"以偶发性现金流入粉饰经营现金流增长","type":"舞弊手法","description":"一次性结案等收益的收款并入经营现金流却未单列，易被误认为核心业务现金创造能力；列报本身可能合规。","theme":"t08","applicability":"直接披露"},{"id":"n215","label":"一次性收益收款混入经营现金流","type":"风险信号","description":"利润表列示偶发收益，但现金流表未单列其影响，经营现金流增长可能主要来自非持续收款。","theme":"t08","applicability":"直接披露"},{"id":"n216","label":"非经常性损益明细","type":"年报披露","description":"区分持续经营成果与资产处置、重组等事项。\n检查一次性核销、重组费用及偶发收益是否影响可持续利润与现金流。","theme":"t08","applicability":"直接披露"},{"id":"n217","label":"追踪偶发收益的现金流影响","type":"核查方法","description":"发现一次性收益后检查收到多少现金及其列报位置，剔除该项后评价可持续经营现金流。","theme":"t08","applicability":"直接披露"},{"id":"n218","label":"以资产出售利得冲减营业费用","type":"舞弊手法","description":"把一次性处置利得作为期间费用减项，制造持续营业盈利改善。","theme":"t08","applicability":"直接披露"},{"id":"n219","label":"终止经营及分部成本披露","type":"年报披露","description":"核查出售状态、终止经营损失及分摊费用变化。","theme":"t08","applicability":"直接披露"},{"id":"n220","label":"存货及跌价准备附注","type":"年报披露","description":"核对存货计价、跌价和注销对成本的影响。\n检查存货余额、项目会计递延生产成本、跌价准备和已减记存货后续出售的披露。\n各类存货、长期存货、列入其他资产的存货及跌价风险；不能仅看流动资产中的存货。","theme":"t09","applicability":"直接披露"},{"id":"n221","label":"未及时计提设备减值","type":"舞弊手法","description":"设备报废或未来收益下降后仍沿原折旧表处理，未将应减值部分转入费用。","theme":"t09","applicability":"直接披露"},{"id":"n222","label":"区分合并利润与母公司经济份额","type":"核查方法","description":"合并100%的收入费用不等于母公司享有全部收益，应核对少数股东份额；合规合并不是舞弊。","theme":"t10","applicability":"直接披露"},{"id":"n223","label":"合并范围与长期股权投资附注","type":"年报披露","description":"核对控制、重大影响及投资会计方法与经济实质。","theme":"t10","applicability":"直接披露"},{"id":"n224","label":"合并营业利润显著高于母公司享有份额","type":"风险信号","description":"需考虑少数股东权益，合规全额合并本身不是舞弊。","theme":"t10","applicability":"直接披露"},{"id":"n225","label":"非金融企业利润依赖利息或投资收益","type":"风险信号","description":"非核心收益可能掩盖主营亏损；金融机构正常利息收入不适用此信号。","theme":"t10","applicability":"直接披露"},{"id":"n226","label":"收购后收入政策从终端销售变为发货确认","type":"风险信号","description":"企业合并后立即改变收入政策并提升收入，需要核对变化原因和金额影响。","theme":"t01","applicability":"跨期比较"},{"id":"n227","label":"先超额计提并购准备再转回利润","type":"舞弊手法","description":"先为裁员或潜在法律支出计提过量准备，后续借实际支出低于预期释放准备增加利润。","theme":"t01","applicability":"跨期比较"},{"id":"n228","label":"高估或有对价后减记负债增利","type":"舞弊手法","description":"初始高估应付或有对价后减少预计支付，在后续确认利得；正常公允价值重估也有同样方向，须分辨估计合理性。","theme":"t01","applicability":"跨期比较"},{"id":"n229","label":"年报差错更正范围或金额扩大","type":"风险信号","description":"初步披露为轻微的会计问题后来扩大至多期收入、资本化、坏账等调整；以最终重述评估真实业务。","theme":"t01","applicability":"跨期比较"},{"id":"n230","label":"合并不同准备余额掩盖贷款准备减少","type":"舞弊手法","description":"将贷款损失准备与其他准备合并披露，掩盖贷款准备下降及核销后补充计提不足。","theme":"t01","applicability":"跨期比较"},{"id":"n231","label":"收入与销售退回内部控制存在重大缺陷","type":"风险信号","description":"年报披露销售退回、交货确认、客户审批及报表分类等重大缺陷，增加错报风险；缺陷不等同已发生舞弊。","theme":"t01","applicability":"跨期比较"},{"id":"n232","label":"资产质量恶化时贷款损失准备反而下降","type":"风险信号","description":"拖欠/坏账增加而单独贷款损失准备下降，合并后的准备却上升；需分拆具体项目。","theme":"t01","applicability":"跨期比较"},{"id":"n233","label":"会计政策指标或财务人员发生异常变化","type":"风险信号","description":"收入政策、指标定义、客户付款条件、高管离职或审计师变更需结合时点和财务效果审视，也可能有正常商业原因。","theme":"t01","applicability":"跨期比较"},{"id":"n234","label":"并购后提前收入确认时点","type":"财务影响","description":"收购后将终端销售确认改为发给经销商时确认，可能使购买后收入及利润提前体现。政策变更本身不构成舞弊证明，需依据年报披露的合同条件、变更原因与金额影响核查确认是否适当。","theme":"t01","applicability":"跨期比较"},{"id":"n235","label":"完整阅读年报并交叉核对披露位置","type":"核查方法","description":"查阅所有附注和管理层讨论，包括标题似乎无关的段落；将金额重大转回或其他利润来源与利润表及准备变动交叉核对。","theme":"t01","applicability":"跨期比较"},{"id":"n236","label":"追踪并购准备与或有对价转回","type":"核查方法","description":"核对初始计提依据、目标业绩、后续付款和损益转回；或有对价下降可能反映被收购业务未达目标，合规重估本身不是舞弊。","theme":"t01","applicability":"跨期比较"},{"id":"n237","label":"分拆准备并联查贷款质量和核销","type":"核查方法","description":"比较贷款损失准备、核销和补充计提与拖欠率/不良贷款走势，避免被其他准备余额的增长掩盖。","theme":"t01","applicability":"跨期比较"},{"id":"n238","label":"财务监督制衡薄弱","type":"风险信号","description":"独裁式管理和薄弱审核制衡增加财务舞弊风险。核查年报实际披露的治理安排；披露不足时不推定存在未披露的内部问题。","theme":"t01","applicability":"跨期比较"},{"id":"n239","label":"目标业绩不达标反而增加收购方利润","type":"风险信号","description":"被购业务低于预期、或有对价负债减少且形成重大利润贡献，不能误读为业务改善。","theme":"t01","applicability":"跨期比较"},{"id":"n240","label":"核查会计及披露变更的时点和影响","type":"核查方法","description":"跨年比较会计政策、指标、分类、客户支付条款以及高管/审计师变化，追问为什么此时改变并在披露充分时比较不变更的结果。","theme":"t01","applicability":"跨期比较"},{"id":"n241","label":"并购相关准备计提后连续转回","type":"风险信号","description":"重组/法律准备计提很大，随后转回对利润贡献显著，需检查最初估计和实际支付。","theme":"t01","applicability":"跨期比较"},{"id":"n242","label":"依据最终重述复核业绩及整改","type":"核查方法","description":"阅读差错性质、最终重述数字和控制整改，评估原有会计处理掩盖的经营问题；初步调整和管理层保证不能替代最终报表。","theme":"t01","applicability":"跨期比较"},{"id":"n243","label":"收入确认会计政策","type":"年报披露","description":"核对收入确认时点、履约条件和总额净额口径。\n检查递延收入、未交付部分价格分摊及确认时点是否变化。\n年报对收入确认时点、经销商交付与终端销售、合同条件的说明。","theme":"t01","applicability":"跨期比较"},{"id":"n244","label":"收入大增但利润率或利润增幅偏弱","type":"风险信号","description":"需核查收入计量口径和真实盈利贡献；规模增长不必然转化为收益。","theme":"t01","applicability":"跨期比较"},{"id":"n245","label":"自办保险损失概率或测算基础变更","type":"风险信号","description":"从行业经验改用自身损失率等假设变动使费用下降，可能产生一次性利润增长，不能等同经营改善。","theme":"t02","applicability":"跨期比较"},{"id":"n246","label":"转回前期准备金削减当期费用","type":"舞弊手法","description":"利用前期预提负债转回或跨账户冲抵费用以增加利润；实际义务减少后的合理转回也会提高利润。","theme":"t02","applicability":"跨期比较"},{"id":"n247","label":"巨额或反复发生的一次性重组费用","type":"风险信号","description":"困难期、新管理层上任或并购前出现巨额核销；连续多年重组则应质疑经常性费用被排除的合理性。","theme":"t02","applicability":"跨期比较"},{"id":"n248","label":"追踪准备金计提使用与转回的滚动变化","type":"核查方法","description":"对照准备金期初、新增、实际支付、转回和期末余额，检查重组或质保义务是否支持余额及转回，而非只看费用下降。","theme":"t02","applicability":"跨期比较"},{"id":"n249","label":"养老金假设或计量日变化带来大额利润","type":"风险信号","description":"寿命、贴现率、资产收益率或计量月份变化可能使费用减少，应从附注量化其影响。","theme":"t02","applicability":"跨期比较"},{"id":"n250","label":"不当递延已赚取收入并在后期释放","type":"舞弊手法","description":"将当期已赚得收入存入递延收入或秘密准备，后续转为收入以平滑利润；真实未履约收入递延并不构成该手法。","theme":"t02","applicability":"跨期比较"},{"id":"n251","label":"超额提取重组或并购准备金","type":"舞弊手法","description":"将未来或虚构支出挤入重组、并购费用，先降利润或列作一次性项目，后续释放多余负债或减少费用。","theme":"t02","applicability":"跨期比较"},{"id":"n252","label":"应收账款增长而坏账准备下降","type":"风险信号","description":"应收增多但准备余额或占比骤降，可能少计坏账费用；应结合回收风险与估计变化核查。","theme":"t02","applicability":"跨期比较"},{"id":"n253","label":"少提或不当转回坏账准备","type":"舞弊手法","description":"应收款项存在回收损失时计提不足或不当转回坏账费用，虚增利润。","theme":"t02","applicability":"跨期比较"},{"id":"n254","label":"后期利润因跨期调节被抬高","type":"财务影响","description":"当期收入储备释放或提前承担后期费用，会造成后续利润增长而非经营改善。","theme":"t02","applicability":"跨期比较"},{"id":"n255","label":"不当调整自办保险估计以减少费用","type":"舞弊手法","description":"改变自办保险损失概率等测算前提降低费用；变更可能合理，需区分估计影响与经营改善。","theme":"t02","applicability":"跨期比较"},{"id":"n256","label":"通过养老金假设或计量日调节费用","type":"舞弊手法","description":"更改寿命、贴现率、预期收益等假设或计量日期，使养老金费用下降或收益增加。","theme":"t02","applicability":"跨期比较"},{"id":"n257","label":"递延收入先猛增后释放且确认政策改变","type":"风险信号","description":"未确认收入储备先积累后下降，或调整未交付部分价格分摊释放收入；多种业务因素也能造成这一趋势。","theme":"t02","applicability":"跨期比较"},{"id":"n258","label":"已大幅减记存货后续出售并提升毛利","type":"风险信号","description":"此前称为陈旧的存货后续售出或相关减值影响转回，显示前期估计可能过大且后期成本偏低。","theme":"t02","applicability":"跨期比较"},{"id":"n259","label":"坏账准备占应收账款比例","type":"财务指标","description":"比较坏账准备与应收账款的比例及跨期变化，可测算比例下降对利润的敏感性。","theme":"t02","applicability":"跨期比较"},{"id":"n260","label":"按准备金比例变化重估费用与利润","type":"核查方法","description":"比较坏账及其他资产准备占相关余额或收入的比例；以原有比例测算利润敏感性，不能将基准测算当作应有计提结论。","theme":"t02","applicability":"跨期比较"},{"id":"n261","label":"核查递延收入滚动和确认政策的变化","type":"核查方法","description":"比较未确认收入期初、新增、释放、期末金额，并量化未交付部分分摊比例变化对收入的影响。","theme":"t02","applicability":"跨期比较"},{"id":"n262","label":"剖析租赁保险养老金假设对利润的影响","type":"核查方法","description":"比较残值、自办保险损失率、养老金精算假设和计量日，分离估计变更与养老金收益对利润的贡献。","theme":"t02","applicability":"跨期比较"},{"id":"n263","label":"当期费用被低报而利润被高报","type":"财务影响","description":"费用资本化、少提损失、激进估计和不当准备金转回可抬高当期利润。","theme":"t02","applicability":"跨期比较"},{"id":"n264","label":"其他流动负债及准备金异常减少","type":"风险信号","description":"软性负债、预提费用、质保或重组准备下降可能冲减费用，需区分实际支付、义务减少与不当转回。","theme":"t02","applicability":"跨期比较"},{"id":"n265","label":"提前核销资产以减少未来成本","type":"舞弊手法","description":"过早核销递延营销支出、存货、完好设备或无形资产，把未来费用前移，并常列为一次性费用。","theme":"t02","applicability":"跨期比较"},{"id":"n266","label":"检查一次性核销对未来成本和经营利润的影响","type":"核查方法","description":"追踪被核销资产后续使用或出售、重组后的费用减少及多余准备转回；反复发生的重组费用应纳入持续性分析。","theme":"t02","applicability":"跨期比较"},{"id":"n267","label":"正常资产突然核销或使用年限过短","type":"风险信号","description":"递延成本一次性转销、完好设备减值或无形资产摊销期过短可能提前消化未来费用。","theme":"t02","applicability":"跨期比较"},{"id":"n268","label":"息税折旧摊销前利润","type":"财务指标","description":"剔除利息、税费、折旧和摊销的利润指标；不等于经营现金流，尤其不能忽略营运资本和资本密集业务的真实成本。","theme":"t11","applicability":"跨期比较"},{"id":"n269","label":"将调整利润逐项还原至报表利润","type":"核查方法","description":"核对调整利润与报表利润差异，检查被剔除费用是否实际反复发生，以及资本化核心成本折旧摊销是否被忽略。","theme":"t11","applicability":"跨期比较"},{"id":"n270","label":"将现金流量替代指标还原至现金流量表","type":"核查方法","description":"追溯替代指标与经营活动现金流量、资本性支出和营运资本变动的差异，纳入常规现金支出及被排除的客户融资。","theme":"t11","applicability":"跨期比较"},{"id":"n271","label":"审计师无法确认重大交易","type":"风险信号","description":"审计报告对重大交易缺乏验证，尤其相关所得对利润贡献重大时，需要追查披露。审计疑虑不能直接证明离岸交易虚构。","theme":"t12","applicability":"跨期比较"},{"id":"n272","label":"核读审计异常和重大交易披露","type":"核查方法","description":"阅读审计报告对无法核实交易的说明，并回查相应交易附注、金额与利润贡献；审计异常是核查起点。","theme":"t12","applicability":"跨期比较"},{"id":"n273","label":"非GAAP盈利与审计亏损差距巨大","type":"风险信号","description":"反复剔除成本可能夸大业绩，应逐项核对指标定义。","theme":"t12","applicability":"跨期比较"},{"id":"n274","label":"按历史同类异常复核后续经营结果","type":"核查方法","description":"将本年疑似渠道压货等资产负债表信号与往年类似变动及之后收入走势对照，识别重复模式；重复关系仍不能证明舞弊。","theme":"t13","applicability":"跨期比较"},{"id":"n275","label":"收入高增长却缺乏利润及现金支持","type":"风险信号","description":"成熟业务收入突增但利润和经营现金流不能支持，需质疑增长经济实质；不是独立舞弊结论。","theme":"t13","applicability":"跨期比较"},{"id":"n276","label":"应付账款周转天数","type":"财务指标","description":"应付账款除以销售成本乘报告期天数；上升提示付款节奏变慢。","theme":"t13","applicability":"跨期比较"},{"id":"n277","label":"通过压低存货和推迟采购粉饰现金流","type":"舞弊手法","description":"减少备货或把采购推至下期使当期流出下降，后期补库会消耗现金，不能当成恒久经营改善。","theme":"t13","applicability":"跨期比较"},{"id":"n278","label":"以应收账款转让粉饰可持续经营现金流","type":"舞弊手法","description":"合法保理或证券化可把未来回款提前至当期；风险在于将非持续增量包装为核心经营改善，转让本身不是舞弊。","theme":"t13","applicability":"跨期比较"},{"id":"n279","label":"客户预付款或可退还订金大幅增加","type":"风险信号","description":"尚未交付产品的预收款显著改善经营现金流，可能仅是未来回款前移，不能等同持续经营改善。","theme":"t13","applicability":"跨期比较"},{"id":"n280","label":"应付账款周转天数和余额显著上升","type":"风险信号","description":"应付账期延长可增加经营现金流，收益可能不可持续，需与业务增长贡献区分。","theme":"t13","applicability":"跨期比较"},{"id":"n281","label":"通过延迟支付货款粉饰持续现金生成能力","type":"舞弊手法","description":"延后供应商付款提高当期经营现金流；现金管理可能合理，但这种增量不能无限重复。","theme":"t13","applicability":"跨期比较"},{"id":"n282","label":"经营现金流增长缺乏持续性","type":"财务影响","description":"提前收款、延迟支付、压低库存及偶发收益能增加当期经营现金流，但不能无限重复。","theme":"t13","applicability":"跨期比较"},{"id":"n283","label":"通过提前收款粉饰持续经营现金流","type":"舞弊手法","description":"收客户预付订金或以折扣加速回款，把未来收款提前；可能是正常议价，仍须识别不可持续的增量。","theme":"t13","applicability":"跨期比较"},{"id":"n284","label":"存货持有量下降和延后补库提升现金流","type":"风险信号","description":"每店存货或采购支出暂时下降带来现金增量，后期恢复库存可能逆转该贡献。","theme":"t13","applicability":"跨期比较"},{"id":"n285","label":"分解营运资本时间调整对现金流的贡献","type":"核查方法","description":"识别应收减少、应付增加、预收款和减库存的现金贡献，结合付款回款及补库安排区分一次性时点收益和业务增长。","theme":"t13","applicability":"跨期比较"},{"id":"n286","label":"风险因素披露","type":"年报披露","description":"比较新出现或改变的客户融资、违约损失、应收转让风险措辞。","theme":"t14","applicability":"跨期比较"},{"id":"n287","label":"应收账款显著减少伴随经营现金流跃升","type":"风险信号","description":"经营现金流增长主要由应收减少驱动时，要区分客户回款与转让收款，不能只看增长幅度。","theme":"t14","applicability":"跨期比较"},{"id":"n288","label":"逐期比较融资相关风险措辞","type":"核查方法","description":"识别新增或改变的客户融资、违约及应收转移披露，并与其他附注交叉检查，不能忽视模板中的变化。","theme":"t14","applicability":"跨期比较"},{"id":"n289","label":"风险因素新增客户融资损失和应收转让安排","type":"风险信号","description":"风险措辞增加借款租赁需求、客户违约或应收转移而缺少细节，提示应进一步核查融资安排。","theme":"t14","applicability":"跨期比较"},{"id":"n290","label":"追溯缩小持续经营业务的比较基数","type":"舞弊手法","description":"以剔除汇率的增长等名称展示指标，同时把部分上期业务追溯剔除，使收入下降看似增长。","theme":"t16","applicability":"跨期比较"},{"id":"n291","label":"历史持续经营收入在新年报中被下调","type":"风险信号","description":"同一历史年度的持续经营收入在连续年报中不一致，可能改变增长基数。","theme":"t16","applicability":"跨期比较"},{"id":"n292","label":"逐期核对经营指标定义与可比范围","type":"核查方法","description":"比较年度指标定义、业务范围、计算期间和被剔除项目，并统一口径后再比较；未披露的基础数据不作假定。","theme":"t16","applicability":"跨期比较"},{"id":"n293","label":"对比同店销售额与单位店铺平均收入","type":"核查方法","description":"将同店销售增长与总收入除以平均门店数所得的单店平均收入趋势比较；背离也可能来自新店表现差，不能直接认定指标操纵。","theme":"t17","applicability":"跨期比较"},{"id":"n294","label":"应收账款转让伴随周转天数骤降","type":"风险信号","description":"周转天数下降和经营现金流增加同时伴随转让规模增长，改善未必来自客户回款变快。","theme":"t03","applicability":"跨期比较"},{"id":"n295","label":"出售业务时递延收入新增且贡献大量经营现金流","type":"风险信号","description":"处置业务同期出现大额递延收入增加、新现金流项目且占经营现金流比例高，需查服务协议与处置整体实质。","theme":"t03","applicability":"跨期比较"},{"id":"n296","label":"核查并购相关现金收支的经济实质与分类","type":"核查方法","description":"对照年报披露的交易条款，核查取得客户、处置业务、受限资金及在职原股东付款在经营/投资/筹资之间的列报；不把所有并购付款直接判为经营费用。","theme":"t03","applicability":"跨期比较"},{"id":"n297","label":"联查债务增长股利支付与现金创造能力","type":"核查方法","description":"将债务和权益变化与经营活动现金流量、资本性支出及股利支付一起比较，识别依赖借债分配或收购的压力。","theme":"t03","applicability":"跨期比较"},{"id":"n298","label":"将业务处置价款拆为预收服务收入","type":"舞弊手法","description":"将部分业务出售对价归为未来使用费预收款，把投资现金流入转成经营现金流入。","theme":"t03","applicability":"跨期比较"},{"id":"n299","label":"收购前目标公司债务激增现金流恶化","type":"风险信号","description":"并购标的债务增长、权益降低和经营现金流下降并存，不能因调整后业绩或并购期待忽视财务压力。","theme":"t03","applicability":"跨期比较"},{"id":"n300","label":"负自由现金流仍以借款支持高额分红","type":"风险信号","description":"持续负自由现金流与高额股利和新增借债并存，提示分配依赖融资和流动性压力，不构成舞弊证明。","theme":"t03","applicability":"跨期比较"},{"id":"n301","label":"并购继承营运资本带来非持续经营现金流","type":"财务影响","description":"收购现金列投资活动，继承应收款/存货的变现列经营流入；也应计入继承应付账款的经营流出。正常会计本身会产生差异。","theme":"t03","applicability":"跨期比较"},{"id":"n302","label":"并购后的自由现金流量","type":"财务指标","description":"经营活动现金流量净额减资本性支出，再减并购支付的现金；用于衡量并购主导型公司的现金创造能力。","theme":"t03","applicability":"跨期比较"},{"id":"n303","label":"通过转让应收账款美化周转天数","type":"舞弊手法","description":"转让应收款减少账面余额，可能掩盖回款放缓。转让也可能是正常现金管理，不能仅据此定性。","theme":"t03","applicability":"跨期比较"},{"id":"n304","label":"资产负债表","type":"年报披露","description":"关注应收、投资、负债和权益之间的匹配。\n检查递延成本、存货、应收款项、准备金及递延收入余额的跨期变化。\n应收款、存货、商誉、负债、权益及跨期余额；同时查阅分类附注。","theme":"t03","applicability":"跨期比较"},{"id":"n305","label":"净利润增长而经营现金流持续落后","type":"风险信号","description":"利润增长同时现金流萎缩或为负，提示检查应收、非现金信用和资本化等来源；差异本身不证明舞弊。","theme":"t03","applicability":"跨期比较"},{"id":"n306","label":"追踪净利润与经营现金流差额来源","type":"核查方法","description":"比较利润与现金流趋势，再从非现金费用、应收、存货、预付及应付变动寻找差额；现金流本身也可能被操纵。","theme":"t03","applicability":"跨期比较"},{"id":"n307","label":"三张报表交叉核对","type":"核查方法","description":"用资产、利润和现金流变化相互印证，异常只产生进一步核查问题。","theme":"t03","applicability":"跨期比较"},{"id":"n308","label":"税费薪酬等应付项目驱动现金流大幅改善","type":"风险信号","description":"税款结算退款或税费、奖金、退休金付款时间变化使经营现金流偶然增加，需从持续经营现金流中分辨。","theme":"t03","applicability":"跨期比较"},{"id":"n309","label":"重组后利润跃升但应收和现金流恶化","type":"风险信号","description":"重组后毛利营业利润大涨，同时应收快于收入、经营现金流恶化，需检查费用前移和准备金释放。","theme":"t03","applicability":"跨期比较"},{"id":"n310","label":"经销商交货口径变更带来的收入前移","type":"财务影响","description":"不同交货确认方式在实务中均可能采用。变更可能前移收入，但是否恰当取决于履约、验收和交易条款。","theme":"t04","applicability":"跨期比较"},{"id":"n311","label":"应收账款增长和周转天数骤升","type":"风险信号","description":"可能反映收入提前确认、信用放松或回款管理变差，不能单独证明舞弊。","theme":"t04","applicability":"跨期比较"},{"id":"n312","label":"交货改发货确认带来的收入前移","type":"财务影响","description":"合同条件和会计政策的变化可能使收入前移。发货确认本身未必不当，需核查履约及交易条件与政策依据。","theme":"t04","applicability":"跨期比较"},{"id":"n313","label":"长期应收款快速积累","type":"风险信号","description":"多年许可费一次确认可能先形成长期应收，亦需考虑真实合同期限。","theme":"t04","applicability":"跨期比较"},{"id":"n314","label":"改用完工百分比法带来的收入前移","type":"财务影响","description":"完工百分比法可适用于长期项目。改变方法会影响收入节奏，应核查适用条件及剔除变更后的趋势，不将合法方法称为舞弊。","theme":"t04","applicability":"跨期比较"},{"id":"n315","label":"预计总成本下调带来的完工收入增加","type":"财务影响","description":"成本投入法下，预计总成本降低会提高完工比例。合理估计修订可能有真实依据，应核查假设和影响，不自动认定收入虚增。","theme":"t04","applicability":"跨期比较"},{"id":"n316","label":"出租设备预计残值占原值比例持续上升","type":"风险信号","description":"提高不需折旧的残值比例直接降低费用，应评估其依据及利润影响。","theme":"t04","applicability":"跨期比较"},{"id":"n317","label":"抬高出租设备残值以减少折旧","type":"舞弊手法","description":"提高租期末设备残值占原值比例，降低应折旧金额，从而增加毛利和营业利润。","theme":"t04","applicability":"跨期比较"},{"id":"n318","label":"政策或估计变更显著支撑业绩","type":"风险信号","description":"收入、费用或利润改善可能源于会计口径变化；应核查理由与影响。","theme":"t04","applicability":"跨期比较"},{"id":"n319","label":"当期利润虚增","type":"财务影响","description":"收入提早确认或费用延后可能抬高当期利润。","theme":"t04","applicability":"跨期比较"},{"id":"n320","label":"不当延长使用年限压低折旧","type":"舞弊手法","description":"无合理依据地延长资产使用年限，推迟费用确认。","theme":"t04","applicability":"跨期比较"},{"id":"n321","label":"虚增残值压低折旧","type":"舞弊手法","description":"无合理依据地提高残值以减少折旧，正常估计调整应与事实一致。","theme":"t04","applicability":"跨期比较"},{"id":"n322","label":"结合账龄信用条件与长期应收分析回款","type":"核查方法","description":"比较应收增长、DSO、账龄、逾期和信用期限；催收不佳也会延长DSO。","theme":"t04","applicability":"跨期比较"},{"id":"n323","label":"逐年比较政策并剔除变更影响","type":"核查方法","description":"比较旧新措辞及量化影响，观察不发生变更时的经营趋势。","theme":"t04","applicability":"跨期比较"},{"id":"n324","label":"客户奖励列报变更的收入金额影响","type":"财务影响","description":"相同客户奖励改列费用可能增加报告收入金额。须核查奖励性质与分类依据；列报变化本身不是舞弊结论。","theme":"t04","applicability":"跨期比较"},{"id":"n325","label":"借坏账计提比例变化抬高收益","type":"舞弊手法","description":"缺乏依据地降低坏账估计可能少计费用，应核查可收回性事实。","theme":"t04","applicability":"跨期比较"},{"id":"n326","label":"应收账款周转天数","type":"财务指标","description":"衡量收入确认与回款速度的变化；应同时考虑长期应收款。识别收入风险时可用期末应收款余额÷收入×报告期天数，须采用同口径全部应收款；平均余额另适于分析平均回款周期。","theme":"t04","applicability":"跨期比较"},{"id":"n327","label":"将经营许可付款不当包装成融资租赁","type":"舞弊手法","description":"将原作为经营开支的软件许可重分类为融资租赁，把大部分付款列为融资租赁本金偿还。","theme":"t05","applicability":"跨期比较"},{"id":"n328","label":"统一现金流分类后再作同业比较","type":"核查方法","description":"将日常采购、外购技术、融资租赁或供应商融资支出按相同经济口径调整，再比较现金生成能力。","theme":"t05","applicability":"跨期比较"},{"id":"n329","label":"经营费用不当资本化","type":"舞弊手法","description":"将本应当期确认的修理、维护、线路等费用计入资产。\n把应属当期的营销获客、研发、线路接入或其他经营支出挂为资产，推迟费用；支付分类还可能抬高经营现金流。","theme":"t05","applicability":"跨期比较"},{"id":"n330","label":"经营现金支出错列投资活动","type":"舞弊手法","description":"将本应经营活动的付款列入投资活动，以抬高经营净现金流。","theme":"t05","applicability":"跨期比较"},{"id":"n331","label":"新增异常资产或关联方保证金迅速增长","type":"风险信号","description":"工具保证金、存货保证金、预付费用或其他资产突然增大，尤其关联供应商项目，可能掩盖费用或存货。","theme":"t05","applicability":"跨期比较"},{"id":"n332","label":"日常采购列入投资活动抬高经营现金流","type":"财务影响","description":"把用于主营业务的材料或短期租赁资料采购现金列投资活动，使经营现金流高于按经济用途调整后的数额。","theme":"t05","applicability":"跨期比较"},{"id":"n333","label":"会计政策和会计估计变更附注","type":"年报披露","description":"查看政策或估计变化的理由及其对收入利润的影响。\n检查资本化、折旧摊销、残值、养老金计量与收入确认政策变更及当期影响。\n收入确认、分类、估计口径变更及其金额影响。","theme":"t05","applicability":"跨期比较"},{"id":"n334","label":"核查资本化依据并重估费用化后的利润","type":"核查方法","description":"核对支出是否带来未来利益、资本化政策何时变化及余额增长；将未恰当资本化的部分还原为费用，评估利润影响。","theme":"t05","applicability":"跨期比较"},{"id":"n335","label":"量化折旧摊销估计变化的利润贡献","type":"核查方法","description":"比较变更前后使用年限，量化少记费用带来的利润，结合产品寿命、设备再利用等理由核查。","theme":"t05","applicability":"跨期比较"},{"id":"n336","label":"经营现金流看似强劲但自由现金流恶化","type":"风险信号","description":"经营支出资本化可能抬高经营现金流，扣除资本开支后仍暴露现金流缺口；筹资分类还需另外核查。","theme":"t05","applicability":"跨期比较"},{"id":"n337","label":"结合发展阶段和自由现金流核查现金质量","type":"核查方法","description":"经营现金流为负可能符合成长阶段；须合看融资、投资支出、资产质量和扩张速度。","theme":"t05","applicability":"跨期比较"},{"id":"n338","label":"自由现金流","type":"财务指标","description":"通常以经营活动现金流量净额减资本性支出计算，结合投资支出观察经营现金流未显示的现金压力。有助于识别经营支出资本化，但不能自动捕获移至筹资的付款。这是非公认会计准则指标，应核对公司实际定义及其变化。","theme":"t05","applicability":"跨期比较"},{"id":"n339","label":"经营与融资现金流双正但投资持续流出","type":"风险信号","description":"若同时自由现金流弱和资产质量差，需核查过度扩张、资本化与现金分类。","theme":"t05","applicability":"跨期比较"},{"id":"n340","label":"递延获客成本快速累积","type":"风险信号","description":"营销支出从费用化转为资本化，未摊销余额占资产或利润比例显著，需评估对当期与未来利润的影响。","theme":"t05","applicability":"跨期比较"},{"id":"n341","label":"软件开发支出资本化比例异常提高","type":"风险信号","description":"资本化额或其占研发支出比例快速上升，需核查技术可行性和未来收益依据，符合条件的资本化本身正常。","theme":"t05","applicability":"跨期比较"},{"id":"n342","label":"资本性支出激增且背离经营方向","type":"风险信号","description":"资本开支与经营方向、原有计划或行业情景背离，同时自由现金流恶化，提示核查不当资本化。","theme":"t05","applicability":"跨期比较"},{"id":"n343","label":"不当延长折旧或摊销期","type":"舞弊手法","description":"超出合理受益期延长折旧摊销，将当期费用推迟；合理使用寿命重估本身并不证明舞弊。","theme":"t05","applicability":"跨期比较"},{"id":"n344","label":"折旧摊销年限延长并显著增厚利润","type":"风险信号","description":"超长或持续延长的年限降低当期费用，应核查量化影响；产品寿命延长和设备再利用可提供合理解释。","theme":"t05","applicability":"跨期比较"},{"id":"n345","label":"经营活动现金流量虚增","type":"财务影响","description":"错误分类或不实收支可能使经营现金流偏高；年报信号不能单独证实虚假现金。","theme":"t05","applicability":"跨期比较"},{"id":"n346","label":"关联客户收入集中且回款薄弱","type":"风险信号","description":"收入依赖母公司或合资方同时账龄延长，需核查经济实质与可收回性。","theme":"t06","applicability":"跨期比较"},{"id":"n347","label":"收入规模虚增","type":"财务影响","description":"错分非收入款项或采用不恰当的总额计量使收入规模偏高。","theme":"t06","applicability":"跨期比较"},{"id":"n348","label":"易货收入增长且关联交易占比高","type":"风险信号","description":"非现金收入的估值与交易独立性值得核查，不能将所有易货交易视为虚假。","theme":"t06","applicability":"跨期比较"},{"id":"n349","label":"应收账款下降而票据或其他客户债权增加","type":"风险信号","description":"应收票据、长期应收或被计入现金类的票据增长与应收账款下降并存；应关注全部客户债权。","theme":"t07","applicability":"跨期比较"},{"id":"n350","label":"将客户应收款重分类以美化周转指标","type":"舞弊手法","description":"把应收账款转为票据/借款或列入其他科目，使只取应收账款的指标下降，而客户仍欠款。","theme":"t07","applicability":"跨期比较"},{"id":"n351","label":"按全部期末应收款重算周转天数","type":"核查方法","description":"识别收入质量时使用期末而非平均应收款；纳入票据、其他科目客户债权，并在披露充分时加回期末转让的应收款。平均余额可用于衡量平均回款周期。","theme":"t07","applicability":"跨期比较"},{"id":"n352","label":"依靠自有客户融资的销售占比上升","type":"风险信号","description":"向客户提供内部贷款带动销售增长，可能放宽条件推动无力还款客户购买，需额外检查信用质量。","theme":"t07","applicability":"跨期比较"},{"id":"n353","label":"资产周转率","type":"财务指标","description":"在资产真实存在的前提下，周转低下可能反映质量问题。","theme":"t07","applicability":"跨期比较"},{"id":"n354","label":"不良贷款上升而损失准备覆盖下降","type":"风险信号","description":"拖欠或不良贷款增加时，损失准备金额或其占不良贷款比例反常下降，提示信用损失确认不足。","theme":"t07","applicability":"跨期比较"},{"id":"n355","label":"负债权益比与净负债率","type":"财务指标","description":"杠杆指标需结合行业、商业模式及有息债务特征理解。","theme":"t07","applicability":"跨期比较"},{"id":"n356","label":"复核资本化折旧及减值估计","type":"核查方法","description":"核对支出性质、资产增加、残值和使用年限；估计变化或资本化本身并不等于舞弊。","theme":"t07","applicability":"跨期比较"},{"id":"n357","label":"将贷款损失准备与贷款质量配对检查","type":"核查方法","description":"比较损失准备与逾期、不良贷款的增减及覆盖比例，客户融资推动销售时另查信用质量。","theme":"t07","applicability":"跨期比较"},{"id":"n358","label":"贷款损失准备占不良贷款比例","type":"财务指标","description":"用贷款损失准备与不良贷款对比，观察贷款质量恶化时准备覆盖是否下降。","theme":"t07","applicability":"跨期比较"},{"id":"n359","label":"结合资产质量和期限结构判断杠杆","type":"核查方法","description":"结合商业模式选择杠杆指标，同时检查低质资产与短融长投风险。","theme":"t07","applicability":"跨期比较"},{"id":"n360","label":"少提贷款损失准备","type":"舞弊手法","description":"贷款质量恶化时未足额确认信用损失，以少计费用维持利润。","theme":"t07","applicability":"跨期比较"},{"id":"n361","label":"资产周转低且往来挂账偏大","type":"风险信号","description":"预付款、其他应收款或投资余额长期挂账可能反映资产质量问题。","theme":"t07","applicability":"跨期比较"},{"id":"n362","label":"无合理依据建立或转回并购准备金抬高利润","type":"舞弊手法","description":"仅指缺少经济依据而借并购准备金形成与转回调节收益。正常的预计义务计提和有依据的转回不属于此手法。","theme":"t08","applicability":"跨期比较"},{"id":"n363","label":"终止经营部门费用在重分类后上升","type":"风险信号","description":"同一历史期间费用向终止经营转移，可能美化持续经营盈利。","theme":"t08","applicability":"跨期比较"},{"id":"n364","label":"可持续营业利润被高估","type":"财务影响","description":"把一次性、非核心收益混入或移走正常费用会扭曲可持续盈利判断。","theme":"t08","applicability":"跨期比较"},{"id":"n365","label":"剔除一次性项目还原营业利润","type":"核查方法","description":"把处置利得、费用净额冲抵和真正持续成本分开，重算同口径盈利。","theme":"t08","applicability":"跨期比较"},{"id":"n366","label":"将正常费用混入一次性重组项目","type":"舞弊手法","description":"把应持续发生的成本作为非经常费用剥离；真实且妥善披露的重组费用可合理单列。","theme":"t08","applicability":"跨期比较"},{"id":"n367","label":"向终止经营部门过度分摊成本","type":"舞弊手法","description":"把更多成本移至拟出售亏损部门，抬高剩余业务利润。","theme":"t08","applicability":"跨期比较"},{"id":"n368","label":"重算终止经营前后的费用归属","type":"核查方法","description":"核对相同历史期间的成本分摊是否转向待售亏损部门，以及处置是否完成。","theme":"t08","applicability":"跨期比较"},{"id":"n369","label":"追踪并购准备金形成与转回","type":"核查方法","description":"检查准备金是否随并购反复形成并转回利润，以及其经济依据。","theme":"t08","applicability":"跨期比较"},{"id":"n370","label":"重组或专项一次性费用反复出现","type":"风险信号","description":"长期重复的所谓一次性成本可能属于正常经营成本。","theme":"t08","applicability":"跨期比较"},{"id":"n371","label":"营业利润跃升但费用率异常下降","type":"风险信号","description":"需核查一次性利得、费用分类和政策变化，不能仅凭增长背离定性。","theme":"t08","applicability":"跨期比较"},{"id":"n372","label":"将长期存货转列其他资产美化存货指标","type":"舞弊手法","description":"将一年内不拟出售的存货列为其他资产，会使仅依据流动存货计算的周转指标失真；分类不必然违规。","theme":"t09","applicability":"跨期比较"},{"id":"n373","label":"其他资产中的长期存货占比上升","type":"风险信号","description":"流动存货看似稳健，而其他资产中的长期存货迅速增长，需合并评估积压和跌价风险。","theme":"t09","applicability":"跨期比较"},{"id":"n374","label":"合并全部存货并重算可比周转指标","type":"核查方法","description":"纳入长期存货、其他资产中的存货及不在门店的存货，按相同范围比较总存货、周转天数和单位面积存货。","theme":"t09","applicability":"跨期比较"},{"id":"n375","label":"存货跌价费用骤降而毛利异常增长","type":"风险信号","description":"存货仍大但跌价损失突然减少或归零、毛利上升而收入变化小，提示估计变化增厚利润。","theme":"t09","applicability":"跨期比较"},{"id":"n376","label":"存货增幅或周转天数异常上升","type":"风险信号","description":"存货增长超过业务及预期销售增长，可能积压；事先规划的战略备货也可能造成存货上升，需结合经营背景判断。","theme":"t09","applicability":"跨期比较"},{"id":"n377","label":"存货计价政策变更的利润影响","type":"财务影响","description":"存货计价变化会影响利润口径。变更本身不等于舞弊，只在有年报披露和可量化影响时核查依据与可比性。","theme":"t09","applicability":"跨期比较"},{"id":"n378","label":"少提存货跌价准备","type":"舞弊手法","description":"无依据降低多余或陈旧存货的跌价损失，抬高当期利润并将压力推迟至出售或报废。","theme":"t09","applicability":"跨期比较"},{"id":"n379","label":"对照资产减值与需求及存货增长","type":"核查方法","description":"检查资产失去收益后的减值，并比较存货周转、预计销售增长与备货战略是否事先存在，核查低跌价费用的理由。","theme":"t09","applicability":"跨期比较"},{"id":"n380","label":"存货周转天数","type":"财务指标","description":"用存货余额与售出存货成本的关系监测库存是否超出业务需要，与销售需求及备货战略一并判断。","theme":"t09","applicability":"跨期比较"},{"id":"n381","label":"核对投资会计判断与盈亏一致性","type":"核查方法","description":"检查重大影响或控制判断变化的事实基础，避免只在盈利时纳入、亏损时排除。","theme":"t10","applicability":"跨期比较"},{"id":"n382","label":"费用率","type":"财务指标","description":"用于检查费用变化能否支持营业利润增长。","theme":"t10","applicability":"跨期比较"},{"id":"n383","label":"毛利率","type":"财务指标","description":"用于比较收入规模与实际盈利贡献，并按业务拆分。","theme":"t10","applicability":"跨期比较"},{"id":"n384","label":"随盈亏操纵重大影响与合并判断","type":"舞弊手法","description":"盈利时纳入投资收益而亏损时排除主体，缺乏实际关系变化依据。","theme":"t10","applicability":"跨期比较"},{"id":"n385","label":"重大影 const palette=['#55b6ce','#e2a663','#79bf9b','#a38bce','#e07e89','#67a3dd','#c3b860','#8bc4c0','#d997bc','#aab8ce','#6db597','#d48665','#8fa2e0','#c6a787','#a7be70','#60b4b3','#d6a2cf','#b7a5dc'];
const themes=new Map(data.themes.map((t,i)=>[t.id,{...t,color:palette[i],index:i,count:0}]));
const nodes=data.nodes.map((n,i)=>({...n,index:i,degree:0,x:0,y:0,vx:0,vy:0,visible:true}));
const byId=new Map(nodes.map(n=>[n.id,n]));
const edges=data.edges.map((e,i)=>({...e,index:i,a:byId.get(e.source),b:byId.get(e.target),visible:true}));
const adjacency=new Map(nodes.map(n=>[n.id,[]]));
for(const e of edges){e.a.degree++;e.b.degree++;adjacency.get(e.source).push(e);if(e.target!==e.source)adjacency.get(e.target).push(e)}
for(const n of nodes){themes.get(n.theme).count++;n.radius=4.1+Math.sqrt(n.degree)*1.75}
const activeThemes=new Set(themes.keys());
let width=0,height=0,camera={x:0,y:0,k:1},selected=null,neighbors=new Set(),hoverNode=null,hoverEdge=null,drag=null,query='',matched=new Set(),queued=false,started=false;
const media=matchMedia('(prefers-color-scheme:dark)');
function element(tag,attrs={},text){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function announce(text){$('status').textContent=text}
function applyAppearance(value){document.documentElement.dataset.theme=value==='system'?(media.matches?'dark':'light'):value;schedule()}
let preference='dark';try{const stored=localStorage.getItem('report-network-theme');if(['dark','light','system'].includes(stored))preference=stored}catch{}
$('appearance').value=preference;applyAppearance(preference);
$('appearance').addEventListener('change',()=>{preference=$('appearance').value;try{localStorage.setItem('report-network-theme',preference)}catch{}applyAppearance(preference)});
media.addEventListener('change',()=>{if(preference==='system')applyAppearance(preference)});
for(const type of ['舞弊手法','风险信号','财务影响','核查方法','年报披露','财务指标'])$('type-filter').append(element('option',{value:type},type));
for(const t of themes.values()){const label=element('label',{class:'theme-option'}),input=element('input',{type:'checkbox','data-theme-id':t.id,checked:''}),swatch=element('span',{class:'swatch'});swatch.style.background=t.color;label.append(input,swatch,element('span',{class:'theme-name'},t.name),element('span',{class:'theme-count'},t.count));input.addEventListener('change',()=>{input.checked?activeThemes.add(t.id):activeThemes.delete(t.id);updateVisibility()});$('theme-list').append(label)}
$('all-themes').addEventListener('change',()=>{activeThemes.clear();if($('all-themes').checked)for(const id of themes.keys())activeThemes.add(id);updateVisibility()});
$('type-filter').addEventListener('change',updateVisibility);
function updateVisibility(){const type=$('type-filter').value;for(const n of nodes)n.visible=activeThemes.has(n.theme)&&(!type||n.type===type);for(const e of edges)e.visible=e.a.visible&&e.b.visible;for(const input of $('theme-list').querySelectorAll('input'))input.checked=activeThemes.has(input.dataset.themeId);$('all-themes').checked=activeThemes.size===themes.size;$('all-themes').indeterminate=activeThemes.size>0&&activeThemes.size<themes.size;$('theme-count').textContent=`${activeThemes.size} / ${themes.size}`;const count=nodes.filter(n=>n.visible).length,links=edges.filter(e=>e.visible).length;$('visible-count').textContent=`${count} 个节点 · ${links} 条关系`;$('view-note').textContent=`${activeThemes.size===themes.size?'全部主题':`已选 ${activeThemes.size} 个主题`}${type?' · '+type:''} · 节点大小表示连接数量`;if(selected&&!byId.get(selected).visible)selectNode(null);hoverNode=null;hoverEdge=null;$('tooltip').hidden=true;schedule();announce(`显示 ${count} 个节点和 ${links} 条关系`)}
function layout(){let seed=230419;const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(const t of themes.values()){const angle=t.index*2.399963229728653,rad=210+110*Math.sqrt(t.index);t.cx=Math.cos(angle)*rad;t.cy=Math.sin(angle)*rad;t.local=0}for(const n of nodes){const t=themes.get(n.theme),angle=t.local++*2.399963229728653,rad=18*Math.sqrt(t.local);n.x=t.cx+Math.cos(angle)*rad+(random()-.5)*12;n.y=t.cy+Math.sin(angle)*rad+(random()-.5)*12}for(let iteration=0;iteration<220;iteration++){for(let i=0;i<nodes.length;i++){const a=nodes[i];for(let j=i+1;j<nodes.length;j++){const b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+.1,d=Math.sqrt(d2),force=380/d2,min=a.radius+b.radius+14;if(d<min)force+=(min-d)*.045;const fx=dx/d*force,fy=dy/d*force;a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy}}for(const e of edges){const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.hypot(dx,dy)||1,target=e.a.theme===e.b.theme?75:220,force=(d-target)*.0018,fx=dx/d*force,fy=dy/d*force;e.a.vx+=fx;e.a.vy+=fy;e.b.vx-=fx;e.b.vy-=fy}const cooling=1-iteration/300;for(const n of nodes){const t=themes.get(n.theme);n.vx=(n.vx+(t.cx-n.x)*.0038)*.76;n.vy=(n.vy+(t.cy-n.y)*.0038)*.76;n.x+=Math.max(-8,Math.min(8,n.vx))*cooling;n.y+=Math.max(-8,Math.min(8,n.vy))*cooling}}}
function screen(n){return{x:n.x*camera.k+camera.x,y:n.y*camera.k+camera.y}}
function world(p){return{x:(p.x-camera.x)/camera.k,y:(p.y-camera.y)/camera.k}}
function fit(){const visible=nodes.filter(n=>n.visible);if(!visible.length){schedule();return}const minX=Math.min(...visible.map(n=>n.x-n.radius)),maxX=Math.max(...visible.map(n=>n.x+n.radius)),minY=Math.min(...visible.map(n=>n.y-n.radius)),maxY=Math.max(...visible.map(n=>n.y+n.radius));camera.k=Math.min((width-100)/(maxX-minX),(height-125)/(maxY-minY),2.3);camera.k=Math.max(.08,camera.k);camera.x=width/2-(minX+maxX)/2*camera.k;camera.y=(height+22)/2-(minY+maxY)/2*camera.k;schedule()}
function resize(){const oldWidth=width,oldHeight=height;({width,height}=stage.getBoundingClientRect());const ratio=devicePixelRatio||1;canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);if(started){camera.x+=(width-oldWidth)/2;camera.y+=(height-oldHeight)/2;schedule()}}
function schedule(){if(!queued){queued=true;requestAnimationFrame(()=>{queued=false;draw()})}}
function connected(n){return !selected||n.id===selected||neighbors.has(n.id)}
function arrow(ax,ay,bx,by,r,color,alpha){const angle=Math.atan2(by-ay,bx-ax),x=bx-Math.cos(angle)*(r+2),y=by-Math.sin(angle)*(r+2),size=4;ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(x-Math.cos(angle-.5)*size,y-Math.sin(angle-.5)*size);ctx.lineTo(x,y);ctx.lineTo(x-Math.cos(angle+.5)*size,y-Math.sin(angle+.5)*size);ctx.stroke()}
function draw(){if(!width||!height)return;const style=getComputedStyle(document.documentElement),bg=style.getPropertyValue('--bg').trim(),text=style.getPropertyValue('--text').trim(),edgeColor=style.getPropertyValue('--edge').trim();ctx.clearRect(0,0,width,height);ctx.fillStyle=bg;ctx.fillRect(0,0,width,height);ctx.lineWidth=.7;for(const e of edges){if(!e.visible)continue;const a=screen(e.a),b=screen(e.b),relevant=selected&&(e.source===selected||e.target===selected),hover=hoverEdge===e.index,alpha=hover?.95:selected?(relevant?.72:.055):.23;ctx.globalAlpha=alpha;ctx.strokeStyle=hover?text:edgeColor;ctx.lineWidth=hover?1.8:relevant?1.15:.65;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();if(relevant||hover||camera.k>1.2)arrow(a.x,a.y,b.x,b.y,Math.max(2,e.b.radius*camera.k),hover?text:edgeColor,alpha)}for(const n of nodes){if(!n.visible)continue;const p=screen(n),r=Math.max(2,n.radius*camera.k);if(p.x+r<0||p.y+r<0||p.x-r>width||p.y-r>height)continue;ctx.globalAlpha=connected(n)?1:.2;ctx.fillStyle=themes.get(n.theme).color;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();if(n.id===selected||n.id===hoverNode||matched.has(n.id)){ctx.strokeStyle=n.id===selected?text:themes.get(n.theme).color;ctx.lineWidth=n.id===selected?2:1.4;ctx.globalAlpha=1;ctx.beginPath();ctx.arc(p.x,p.y,r+3.5,0,Math.PI*2);ctx.stroke()}}ctx.globalAlpha=1;const labels=nodes.filter(n=>n.visible&&(n.id===selected||n.id===hoverNode||matched.has(n.id)||(camera.k>1.5&&connected(n))||(camera.k>.52&&n.degree>=13&&connected(n)))).sort((a,b)=>((b.id===selected?1000:0)+(b.id===hoverNode?900:0)+(matched.has(b.id)?500:0)+b.degree)-((a.id===selected?1000:0)+(a.id===hoverNode?900:0)+(matched.has(a.id)?500:0)+a.degree));const placed=[];ctx.font='12px system-ui,"Microsoft YaHei",sans-serif';ctx.textBaseline='middle';for(const n of labels){const p=screen(n),r=Math.max(2,n.radius*camera.k),w=ctx.measureText(n.label).width+8,box={x:p.x+r+5,y:p.y-9,w,h:18};if(box.x<0||box.y<48||box.x+box.w>width-5||box.y+box.h>height-24)continue;if(placed.some(b=>box.x<b.x+b.w&&box.x+box.w>b.x&&box.y<b.y+b.h&&box.y+box.h>b.y))continue;placed.push(box);ctx.globalAlpha=.9;ctx.fillStyle=bg;ctx.fillRect(box.x,box.y,box.w,box.h);ctx.globalAlpha=1;ctx.fillStyle=text;ctx.fillText(n.label,box.x+4,p.y)}ctx.globalAlpha=1;if(!nodes.some(n=>n.visible)){ctx.fillStyle=text;ctx.font='14px system-ui,"Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('没有可见节点，请调整主题或类型筛选。',width/2,height/2);ctx.textAlign='left'}}
function setSidebar(open){document.body.classList.toggle('sidebar-open',open);$('sidebar-toggle').setAttribute('aria-expanded',String(open))}
$('sidebar-toggle').addEventListener('click',()=>setSidebar(!document.body.classList.contains('sidebar-open')));$('sidebar-veil').addEventListener('click',()=>setSidebar(false));
function selectNode(id){selected=id;neighbors=new Set();$('detail-empty').hidden=!!id;$('detail-content').hidden=!id;$('clear-selection').hidden=!id;if(!id){schedule();return}const n=byId.get(id),links=adjacency.get(id);for(const e of links)neighbors.add(e.source===id?e.target:e.source);$('detail-kind').textContent=n.type;$('detail-title').textContent=n.label;$('detail-description').textContent=n.description;$('detail-meta').replaceChildren(element('span',{},`主题：${themes.get(n.theme).name}`),element('span',{},`使用条件：${n.applicability}`));$('neighbor-heading').textContent=`全部相邻关系 · ${links.length} 条 / ${neighbors.size} 个节点`;$('neighbors').replaceChildren();for(const e of links){const outgoing=e.source===id,other=outgoing?e.b:e.a,row=element('div',{class:'neighbor'}),button=element('button',{'data-node-id':other.id},other.label);row.append(element('small',{},outgoing?`当前节点 → ${e.relation}`:`${e.relation} → 当前节点`));button.addEventListener('click',()=>locate(other.id));row.append(button);if(e.description)row.append(element('p',{},e.description));$('neighbors').append(row)}schedule();announce(`${n.label}，${links.length} 条相邻关系`)}
$('clear-selection').addEventListener('click',()=>selectNode(null));
function locate(id){const n=byId.get(id);activeThemes.add(n.theme);if($('type-filter').value&&$('type-filter').value!==n.type)$('type-filter').value='';updateVisibility();$('search').value='';search();selectNode(id);camera.k=Math.max(camera.k,1.25);camera.x=width/2-n.x*camera.k;camera.y=height/2-n.y*camera.k;hoverNode=null;hoverEdge=null;$('tooltip').hidden=true;schedule();if(innerWidth<=760)setSidebar(false)}
function search(){query=$('search').value.trim().toLocaleLowerCase();const found=query?nodes.filter(n=>n.label.toLocaleLowerCase().includes(query)):[];matched=new Set(found.map(n=>n.id));$('search-results').hidden=!query;$('search-count').hidden=!query;$('search-count').textContent=found.length>20?`匹配 ${found.length} 个节点，显示前 20 项`:`匹配 ${found.length} 个节点`;$('search-results').replaceChildren();for(const n of found.slice(0,20)){const li=element('li'),button=element('button',{'data-node-id':n.id},n.label);button.append(element('small',{},`${n.type} · ${themes.get(n.theme).name}`));button.addEventListener('click',()=>locate(n.id));li.append(button);$('search-results').append(li)}schedule()}
$('search').addEventListener('input',search);$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){const button=$('search-results').querySelector('button');if(button)button.click()}if(e.key==='Escape'){$('search').value='';search()}});
function zoom(factor,p={x:width/2,y:height/2}){const origin=world(p),next=Math.max(.08,Math.min(6,camera.k*factor));camera.k=next;camera.x=p.x-origin.x*next;camera.y=p.y-origin.y*next;$('tooltip').hidden=true;schedule()}
$('zoom-in').addEventListener('click',()=>zoom(1.25));$('zoom-out').addEventListener('click',()=>zoom(.8));$('fit').addEventListener('click',fit);
function local(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function hitNode(p){let best=null,distance=Infinity;for(const n of nodes){if(!n.visible)continue;const s=screen(n),d=Math.hypot(p.x-s.x,p.y-s.y);if(d<=Math.max(6,n.radius*camera.k+3)&&d<distance){distance=d;best=n}}return best}
function hitEdge(p){let best=null,distance=4;for(const e of edges){if(!e.visible)continue;const a=screen(e.a),b=screen(e.b),dx=b.x-a.x,dy=b.y-a.y,len=dx*dx+dy*dy;if(!len)continue;const t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/len)),d=Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy);if(d<distance){distance=d;best=e}}return best}
function showTooltip(p,node,edge){const tip=$('tooltip');tip.replaceChildren();if(node){tip.append(document.createTextNode(node.label),element('small',{},`${node.type} · ${themes.get(node.theme).name} · ${node.degree} 条连接`))}else if(edge){tip.append(document.createTextNode(`${edge.a.label}\n${edge.relation} →\n${edge.b.label}`));if(edge.description)tip.append(element('small',{},edge.description))}else{tip.hidden=true;return}tip.hidden=false;tip.style.left=`${Math.max(8,Math.min(width-tip.offsetWidth-8,p.x+15))}px`;tip.style.top=`${Math.max(8,Math.min(height-tip.offsetHeight-8,p.y+15))}px`}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;const p=local(e),node=hitNode(p);drag={id:e.pointerId,start:p,last:p,node,moved:false};canvas.setPointerCapture(e.pointerId);canvas.style.cursor=node?'grabbing':'grabbing';$('tooltip').hidden=true});
canvas.addEventListener('pointermove',e=>{const p=local(e);if(drag&&e.pointerId===drag.id){if(Math.hypot(p.x-drag.start.x,p.y-drag.start.y)>3)drag.moved=true;if(drag.moved){if(drag.node){drag.node.x+=(p.x-drag.last.x)/camera.k;drag.node.y+=(p.y-drag.last.y)/camera.k}else{camera.x+=p.x-drag.last.x;camera.y+=p.y-drag.last.y}drag.last=p;schedule()}return}const node=hitNode(p),edge=node?null:hitEdge(p);hoverNode=node?.id||null;hoverEdge=edge?.index??null;canvas.style.cursor=node?'grab':'default';showTooltip(p,node,edge);schedule()});
canvas.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const previous=drag;drag=null;canvas.releasePointerCapture(e.pointerId);if(!previous.moved){selectNode(previous.node?.id||null);if(previous.node&&innerWidth<=760)setSidebar(true)}canvas.style.cursor='default';schedule()});
canvas.addEventListener('pointercancel',()=>{drag=null;canvas.style.cursor='default'});canvas.addEventListener('pointerleave',()=>{if(!drag){hoverNode=null;hoverEdge=null;$('tooltip').hidden=true;schedule()}});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:1/1.12,local(e))},{passive:false});
canvas.addEventListener('keydown',e=>{if(e.key==='Escape'){selectNode(null);setSidebar(false)}else if(e.key==='+'||e.key==='='){zoom(1.25);e.preventDefault()}else if(e.key==='-'){zoom(.8);e.preventDefault()}else if(e.key==='0'){fit();e.preventDefault()}});
layout();resize();started=true;fit();new ResizeObserver(resize).observe(stage);updateVisibility();
})();
</script>
